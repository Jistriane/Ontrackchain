name: ADR-029 Pre-Merge 5 Gates (RBAC / BillingCap / BillingEnf / LGPD ROPD / Secrets TruffleHog)

# ✅ GATILHO ATIVADO Sprint28+8 (2026-08-11) — Pós sign-off M5 baseline v1.9.
# on: [] foi REMOVIDO em Sprint28+8 para ativar gates obrigatórios em todo PR → main.
# Mantemos workflow_dispatch para execução manual on-demand (ex: validar baseline).
#
# Pré-requisitos Repository Variables (Settings → Secrets and variables → Actions → Variables):
#   1. DPO_EMAIL                          = dpo@ontrackchain.com.br    (LGPD Art.41 obrigatório)
#   2. OTK_CI_PRE_MERGE_ENFORCE_ALL       = true                       (bloqueia --skip-q1..q5 CI)
#
# Referência técnica: ADR-029, qa-gateway cli.py Q3-09 run-pre-merge-gates
# Última atualização: Sprint28+8, 2026-08-11. Versão 1.1 do YAML.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-merge-5-gates-failfast:
    name: ADR-029 Pre-Merge 5 Gates FAIL-FAST (Q1→Q2→Q3→Q4→Q5 sempre)
    runs-on: ubuntu-24.04
    timeout-minutes: 180  # 2h TruffleHog pode demorar se repositório grande; +40min buffers Python.
    # Fail-fast: qualquer job filho falha, workflow todo cancela.
    # Em cada job, usamos continue-on-error: false (padrão).
    # Exceção conceitual tratada no qa-gateway: Q5 SEMPRE roda mesmo se Q1..Q4 já falharam
    # (isso é implementado LÁ DENTRO do qa-gateway run-pre-merge-gates, não aqui no YAML.)

    env:
      # BLOQUEIA flags --skip-q1..--skip-q5. Ninguém pula gates em CI.
      # Após M5 push, ativar isso como repository variable permanece.
      OTK_CI_PRE_MERGE_ENFORCE_ALL: ${{ vars.OTK_CI_PRE_MERGE_ENFORCE_ALL || 'true' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 01 — Checkout repositório (full history para TruffleHog --since HEAD~1)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # TruffleHog precisa de histórico completo para escaneamento profundo
          submodules: false

      - name: 02 — Setup Python 3.11.x (stack obrigatória Ontrackchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            ontrackchain/packages/qa-gateway/pyproject.toml
            ontrackchain/packages/qa-gateway/requirements*.txt

      - name: 03 — Instalar qa-gateway local + dependências (maturidade S26)
        shell: bash
        run: |
          set -euo pipefail
          cd ontrackchain/packages/qa-gateway
          python -m pip install --upgrade pip setuptools wheel
          # Instalar em modo editável para usar CLI `qa-gateway` diretamente no PATH
          python -m pip install -e ".[dev,tests]"
          # Validar binário qa-gateway acessível
          qa-gateway --help > /dev/null
          echo "✅ qa-gateway instalado: $(qa-gateway --version 2>&1 || qa-gateway --help 2>&1 | head -2)"

      - name: 04 — Instalar TruffleHog v3.96.0 (binário oficial GitHub + SHA256 pinado)
        shell: bash
        run: |
          set -euo pipefail
          # Versão e SHA256 pinados = reproducibilidade + mitigação supply-chain attack.
          # Release: trufflesecurity/trufflehog v3.96.0 (2026-08-01, Linux x86_64)
          TH_VERSION="3.96.0"
          TH_SHA256="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"  # SHA256 oficial — Atualizar após cada bump versão
          mkdir -p /tmp/th-install
          cd /tmp/th-install
          curl -fsSLo "trufflehog_${TH_VERSION}_linux_amd64.tar.gz" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TH_VERSION}/trufflehog_${TH_VERSION}_linux_amd64.tar.gz"
          # NOTA: Em ambientes air-gapped / enterprise, substitua o curl acima por um mirror interno
          #       ou binário assinado via internal artifact registry.
          # Validar SHA256 (fail-closed):
          echo "${TH_SHA256}  trufflehog_${TH_VERSION}_linux_amd64.tar.gz" > SHA256SUMS
          sha256sum -c SHA256SUMS || {
            echo "❌ TRUFFLEHOG SHA256 MISMATCH (supply-chain attack suspeito). ABORTAR."
            exit 98
          }
          tar -xzf "trufflehog_${TH_VERSION}_linux_amd64.tar.gz"
          mv trufflehog /usr/local/bin/trufflehog
          chmod +x /usr/local/bin/trufflehog
          # Step 05 qa-gateway PATH já tem /usr/local/bin incluso
          INSTALLED_VER="$(trufflehog --version | head -1)"
          echo "✅ TruffleHog instalado: ${INSTALLED_VER}"

      - name: 05 — Executar ADR-029 5 Gates Pre-Merge (ORQUESTRADOR qa-gateway FONTE ÚNICA)
        id: gates
        shell: bash
        # exit 0 = todos gates passaram; exit !=0 = algum gate falhou (fail-closed).
        # A ordenação FAIL-FAST + Q5 sempre executa é GARANTIDA dentro do qa-gateway.
        run: |
          set -euo pipefail
          DPO_EMAIL="${{ vars.DPO_EMAIL }}"
          if [ -z "$DPO_EMAIL" ]; then
            echo "❌ ERRO: Repository Variable DPO_EMAIL não definida. Vá em Settings → Secrets and variables → Actions → Variables → New repository variable → DPO_EMAIL = dpo@empresa.com.br"
            echo "   É obrigatório por LGPD Art.41 (DPO nomeado) e BACEN Circular X Art.12."
            exit 3  # parâmetro inválido (QA-GATEWAY exit codes helpers)
          fi
          mkdir -p ./qa-reports
          echo "🚀 Rodando ADR-029 5 Gates Pre-Merge — Fail-FAST Q1→Q2→Q3→Q4 + Q5 SEMPRE"
          echo "   PR: ${{ github.event.number }} SHA: ${{ github.sha }}"
          # Ordem e flags da FONTE ÚNICA (qa-gateway):
          # --dpo-email                 obrigatório (LGPD BACEN)
          # --strict                    default True (warnings > 0 → issues → exit 1)
          # --max-warnings 0            default 0 (cumpre ADR-018 STRICT pattern herdado)
          # --check-prod-redis          default True (valida billing enforcement prod counter)
          # --report-dir                ./qa-reports (padrão ADR-029 schema 1.0 JSON)
          qa-gateway run-pre-merge-gates \
            --dpo-email "$DPO_EMAIL" \
            --strict \
            --max-warnings 0 \
            --check-prod-redis \
            --report-dir ./qa-reports \
            --failures-json ./qa-reports/pre-merge-${{ github.sha }}-failures.json || {
              EXIT=$?
              echo "❌ Gates Pre-Merge finalizados com falhas (exit=$EXIT). Relatório JSON salvo em ./qa-reports/pre-merge-${{ github.sha }}.json"
              echo "   Para detalhes, fazer download do artifact abaixo e/ou abrir Summary do Job."
              exit $EXIT
            }
          echo "✅ TODOS 5 GATES PRE-MERGE APROVADOS (exit=0). PR liberado para merge após code review humano."

      - name: 06 — Helm lint + chart manifestos K8s (Sprint28+13 IaC)
        if: always()
        run: |
          set -euo pipefail
          CHART_DIR="./ontrackchain/infra/k8s/charts/ontrackchain-platform"
          if command -v helm >/dev/null 2>&1; then
            echo "🚀 Helm version: $(helm version --short)"
            helm lint "$CHART_DIR" --strict --with-subcharts || {
              echo "❌ Helm lint FALHOU (LGPD Art.49 §6: configuração cluster em risco)"
              echo "   Rodar local: helm lint $CHART_DIR --strict"
              exit 4
            }
            echo "✅ Helm lint --strict PASSOU (chart versão válida)"
            echo "⚙️  helm template dry-run (sem servidor) para validar manifests..."
            helm template otk-ci "$CHART_DIR" > /tmp/helm-rendered-ci.yaml || {
              echo "❌ helm template FALHOU: placeholders values.yaml com valores vazios"
              exit 4
            }
            RENDERED=$(wc -l < /tmp/helm-rendered-ci.yaml)
            echo "✅ helm template OK: $RENDERED linhas"
          else
            echo "⚠️  helm CLI não disponível no runner (skipped). Para ativar: actions/setup-buildx + instalar helm"
          fi

      - name: 07 — Upload artifact relatórios QA (retention 180 dias LGPD 6 meses)
        if: always()   # SEMPRE salva relatório, mesmo que gates falhem (evidência auditoria)
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-pre-merge-${{ github.sha }}
          path: |
            ./qa-reports/pre-merge-*.json
            ./qa-reports/pre-merge-*-failures.json
            ./qa-reports/**/*.log
          retention-days: 180  # LGPD Art.15 §3 prazo mínimo de guarda evidências
          if-no-files-found: warn
