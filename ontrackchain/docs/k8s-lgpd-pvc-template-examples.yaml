# Template YAML Sprint28+7 — StatefulSet PVC LGPD Encryption Labels
# (P2.6 ADR-018 item 35 PVC LGPD label · ADR-016 Observabilidade S3 WORM backup)
#
# ESTE ARQUIVO É EXEMPLO COMENTADO — NÃO aplicar `kubectl apply -f` diretamente.
# Substituir placeholders __NAMESPACE__, __POSTGRES_PASSWORD_KMS_CRYPTED__,
# __SC_EBS_ENCRYPTED__, __VOLUME_SIZE__ etc. ANTES de aplicar em staging/prod.
#
# Itens LGPD obrigatórios (BACEN Circular 4.026 Art.14 + LGPD Art.32 §I):
#   (1) PVC label `ontrackchain.io/lgpd-class: restricted-dados-pessoais` EM TODOS os
#       StatefulSets volumeClaimTemplates que armazenem dados pessoais (PII).
#   (2) StorageClass obrigatória `encryption: aws:ebs:aes256` (sa-east-1 CMK próprio).
#   (3) NÃO armazenar senha plaintext em spec.env.value — usar env.valueFrom.secretKeyRef
#       com Secrets Opaque criptografados por KMS/HSM (SOPS M5 Step02).
#   (4) NÃO montar PVC em hostPath (zero-trust ADR-003 Resilience v3).
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ontrackchain-gp3-encrypted-lgpd-restricted
  labels:
    ontrackchain.io/lgpd-class: restricted-dados-pessoais
    ontrackchain.io/owner: "dsi@ontrackchain.com.br"
    ontrackchain.io/retenção-meses: "120"  # BACEN Circular 3.978 Art.17 (10 anos WORM)
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"                        # OBRIGATÓRIO por LGPD Art.32
  kmsKeyId: "arn:aws:kms:sa-east-1:__AWS_ACCOUNT_ID__:key/__KMS_CMK_PG_VOLUME_ID__"
  fsType: ext4
  csi.storage.k8s.io/fstype: ext4
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain                      # NÃO Delete automático (BACEN obriga retenção)
---
# ============================================================
# Exemplo 1/4: PostgreSQL 16 Patroni Cluster (investigation DB)
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-patroni
  namespace: __NAMESPACE_ONTRACKCHAIN__
  labels:
    app: postgres-patroni
    ontrackchain.io/lgpd-class: restricted-dados-pessoais
    ontrackchain.io/system: investigation-database-pg16-pgvector
spec:
  serviceName: postgres-patroni-headless
  replicas: 3
  selector:
    matchLabels:
      app: postgres-patroni
  template:
    metadata:
      labels:
        app: postgres-patroni
    spec:
      serviceAccountName: patroni-sa
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: postgres
          image: "postgres:16.4-alpine-pgvector074@sha256:__DIGEST_PINNADO__"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # NÃO usar env.value para senhas — usar SOPS KMS + envFrom
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patroni-postgres-secret
                  key: postgres_password     # cryptado SOPS KMS (M5 Step02 ativar)
          resources:
            requests: { cpu: "2", memory: "4Gi" }
            limits:   { cpu: "4", memory: "16Gi" }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: pg-wal
              mountPath: /var/lib/postgresql/wal
          livenessProbe:
            exec: { command: [pg_isready, -U, postgres] }
            initialDelaySeconds: 30; periodSeconds: 10; timeoutSeconds: 5; failureThreshold: 6
          readinessProbe:
            exec: { command: [pg_isready, -U, postgres] }
            initialDelaySeconds: 10; periodSeconds: 5
  # ===================== OBRIGATÓRIO LGPD ADR-018 item 35 =====================
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          ontrackchain.io/lgpd-class: restricted-dados-pessoais  # ← LABEL OBRIGATÓRIO
          ontrackchain.io/data-classification: "pii-e-sensiveis-financeiros"
          ontrackchain.io/retenção-meses: "120"                   # BACEN 10 anos
          ontrackchain.io/worm-mode: "compliance-pendente-ativar"  # ROS/COAF ativar P1.6
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ontrackchain-gp3-encrypted-lgpd-restricted  # ← SC OBRIGATÓRIO
        resources:
          requests: { storage: 500Gi }
    - metadata:
        name: pg-wal
        labels:
          ontrackchain.io/lgpd-class: restricted-dados-pessoais
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ontrackchain-gp3-encrypted-lgpd-restricted
        resources:
          requests: { storage: 150Gi }
---
# ============================================================
# Exemplo 2/4: Prometheus (metrics / alertas P0)
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: __NAMESPACE_ONTRACKCHAIN__
  labels:
    app.kubernetes.io/name: prometheus
    ontrackchain.io/lgpd-class: restricted-dados-pessoais  # métricas contêm user_id/JTI auditável
spec:
  serviceName: prometheus-headless
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata: { labels: { app.kubernetes.io/name: prometheus } }
    spec:
      serviceAccountName: prometheus-sa
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: prometheus
          image: "prom/prometheus:v2.54.1@sha256:__DIGEST_PINNADO__"
          args: [
            "--config.file=/etc/prometheus/prometheus.yml",
            "--storage.tsdb.path=/prometheus",
            "--storage.tsdb.retention.time=180d",    # LGPD 180d logs métricas íntegros
            "--web.enable-lifecycle"
          ]
          ports: [{ containerPort: 9090, name: http }]
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 10; periodSeconds: 5
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 30; periodSeconds: 15
          volumeMounts:
            - name: prometheus-tsdb
              mountPath: /prometheus
  volumeClaimTemplates:
    - metadata:
        name: prometheus-tsdb
        labels:
          ontrackchain.io/lgpd-class: restricted-dados-pessoais  # ← LABEL OBRIGATÓRIO
          ontrackchain.io/data-classification: métricas-auditáveis-RBAC
          ontrackchain.io/retenção-meses: "6"                     # 180 dias
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ontrackchain-gp3-encrypted-lgpd-restricted
        resources: { requests: { storage: 200Gi } }
---
# ============================================================
# Exemplo 3/4: Grafana (dashboards + alertas visuais)
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: __NAMESPACE_ONTRACKCHAIN__
  labels:
    app.kubernetes.io/name: grafana
    ontrackchain.io/lgpd-class: restricted-dados-pessoais
spec:
  serviceName: grafana-headless
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: grafana } }
  template:
    metadata: { labels: { app.kubernetes.io/name: grafana } }
    spec:
      securityContext:
        fsGroup: 472
        runAsNonRoot: true
        runAsUser: 472
      containers:
        - name: grafana
          image: "grafana/grafana:11.2.0@sha256:__DIGEST_PINNADO__"
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-secrets, key: admin_password } }
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: keycloak-grafana-client, key: client_secret } }
          ports: [{ containerPort: 3000, name: http }]
          volumeMounts:
            - name: grafana-lib
              mountPath: /var/lib/grafana
  volumeClaimTemplates:
    - metadata:
        name: grafana-lib
        labels:
          ontrackchain.io/lgpd-class: restricted-dados-pessoais  # ← LABEL OBRIGATÓRIO
          ontrackchain.io/data-classification: dashboards-e-contas-admin-audit
          ontrackchain.io/retenção-meses: "36"
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ontrackchain-gp3-encrypted-lgpd-restricted
        resources: { requests: { storage: 50Gi } }
---
# ============================================================
# Exemplo 4/4: Redis 7 Cluster Cache (sessões, rate limit, locks)
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: __NAMESPACE_ONTRACKCHAIN__
  labels:
    app: redis
    ontrackchain.io/lgpd-class: restricted-dados-pessoais  # sessões = PII JTI + roles
spec:
  serviceName: redis-cluster-headless
  replicas: 6  # 3 master / 3 replica
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      securityContext: { fsGroup: 999, runAsNonRoot: true, runAsUser: 999 }
      containers:
        - name: redis
          image: "redis:7.2-alpine@sha256:__DIGEST_PINNADO__"
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - /etc/redis/redis.conf
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: redis-secrets, key: password } }
          ports: [{ containerPort: 6379, name: client }, { containerPort: 16379, name: gossip }]
          livenessProbe:
            exec: { command: ["redis-cli","-a","$(REDIS_PASSWORD)","ping"] }
            initialDelaySeconds: 20; periodSeconds: 10; timeoutSeconds: 5
          readinessProbe:
            exec: { command: ["redis-cli","-a","$(REDIS_PASSWORD)","ping"] }
            initialDelaySeconds: 5; periodSeconds: 5
          volumeMounts: [{ name: redis-data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          ontrackchain.io/lgpd-class: restricted-dados-pessoais  # ← LABEL OBRIGATÓRIO
          ontrackchain.io/data-classification: cache-sessoes-ratelimit-OTK_*
          ontrackchain.io/retenção-meses: "1"  # sessões curtas / rate-limit efêmero
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ontrackchain-gp3-encrypted-lgpd-restricted
        resources: { requests: { storage: 20Gi } }
---
# VALIDAÇÃO OBRIGATÓRIA (pré-apply):
#   $ kubectl apply --dry-run=client -f docs/k8s-lgpd-pvc-template-examples.yaml
#   $ kubectl get sc ontrackchain-gp3-encrypted-lgpd-restricted -o yaml | grep encrypted
#   → encrypted: "true"
#   $ for ns in postgres prometheus grafana redis; do
#        kubectl -n $ns get pvc -o yaml | grep -q "ontrackchain.io/lgpd-class: restricted-dados-pessoais" \
#          && echo "✅ $ns labels LGPD ok" || echo "❌ $ns FALTOU LABEL LGPD"
#     done
