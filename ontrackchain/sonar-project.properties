#   → /sonar-project.properties  (SSOT atual, alinhado com ci.yml S28+26→S28+47)
#
# POR QUE ESTÁ OBSOLETO:
#   · ProjectKey conflitante: antigo = Ontrackchain_ontrackchain / novo = ontrackchain_ontrackchain
#   · Fontes com caminhos errados: apps/ sem prefixo ontrackchain/ (hierarquia real = monorepo)
#   · Paths coverage desencontrados: tmp_coverage/ vs ontrackchain/tmp_coverage/*.xml
#   · Versão do projeto desatualizada: 1.0.0-MVP-QA-DevOps → 3.1.0-m5
#
# DESTINO PARA QUALQUER ALTERAÇÃO SONAR:
#   → Editar SEMPRE o /sonar-project.properties NA RAIZ (1 nível acima desta pasta)
#   → CI job (ontrackchain/.github/workflows/ci.yml) projectBaseDir = workspace RAIZ
#
# ARQUIVO MANTIDO APENAS PARA RASTREABILIDADE HISTÓRICA (sprint 9 M8).
# NÃO EDITE ESTE ARQUIVO — ALTERAÇÕES AQUI NÃO TEM EFEITO NO CI MODERNO.
# ==============================================================================
# SonarQube / SonarCloud — Ontrackchain Platform (Sprint 9 M8)
# [OBSOLETO S28+47] Ver /sonar-project.properties na RAIZ do repositório.
# ==============================================================================

# ---- Identificação do Projeto SonarCloud ----
sonar.organization=ontrackchain
sonar.projectKey=Ontrackchain_ontrackchain
sonar.projectName=Ontrackchain Platform
sonar.projectVersion=1.0.0-MVP-QA-DevOps

# ---- Fontes e Linguagens ----
sonar.sources=apps/,packages/,infra/,.github/workflows/
sonar.tests=tests/,apps/frontend/tests/
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11
sonar.javascript.node.maxspace=4096

# ---- Fontes Python (monorepo múltiplos apps/packages) ----
sonar.python.coverage.reportPaths=tmp_coverage/coverage.xml,apps/*/tmp_coverage/coverage.xml,packages/*/tmp_coverage/coverage.xml
sonar.python.xunit.reportPath=tmp_tests/reports/*.xml,apps/*/tmp_tests/reports/*.xml,packages/*/tmp_tests/reports/*.xml
sonar.python.bandit.reportPaths=tmp_sast/bandit.json

# ---- Exclusões (NÃO analisar docs, migrations SQL, assets estáticos 3rd-party) ----
sonar.exclusions=\
  docs/**,\
  **/migrations/**/*.sql,\
  **/migrations/versions/**/*.py,\
  **/node_modules/**,\
  **/vendor/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  **/venv/**,\
  **/.git/**,\
  **/dist/**,\
  **/build/**,\
  **/.mypy_cache/**,\
  **/.pytest_cache/**,\
  apps/frontend/public/**,\
  infra/observability/grafana/dashboards/*.json,\
  **/tmp_*/**,\
  ci-artifacts/**,\
  artifacts/**

# ---- Duplicação e Complexidade ----
sonar.cpd.exclusions=apps/frontend/tests/e2e/**,tests/test_p0_*.py
sonar.python.file.suffixes=.py
sonar.issue.ignore.multicriteria=j1
# j1: ignorar linhas que contém apenas "#" comentários documentação longa
sonar.issue.ignore.multicriteria.j1.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.j1.resourceKey=**/main.py

# ---- Quality Gate padrão SonarCloud way + Override para MVP: 80% linhas ----
# (Se quiser strict: new coverage = 90% e overall = 85%.)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# ---- Duplicate blocks (MVP aceita um pouco mais alto, monorepo multi apps) ----
sonar.cpd.python.minimumTokens=120
sonar.cpd.javascript.minimumTokens=150
