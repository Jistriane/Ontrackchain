# .sops.yaml — Ontrackchain SOPS Configuration (ADR-026 M5 Step02)
# Status: CONFIGURADO Sprint 28+13. CMK placeholder ATIVO. Substituir ARNs abaixo após
#         `terraform apply -auto-approve` do sops-kms-s3-worm/ output `sops_cmk_arn`.
# Quando ativar: APÓS sign-off humano M5 + revogações P0 + AWS KMS CMK criado.
# Passo a passo ativação AWS KMS (Opção 1 RECOMENDADA, ~10min console AWS):
#   1. Console AWS → IAM/KMS → Customer managed keys → Create key (Symmetric, single-region, sa-east-1).
#   2. Alias: alias/ontrackchain-sops-kek. Description: "SOPS KEK Ontrackchain Monorepo M5 Step02".
#   3. Key policy (RECOMENDADO):
#        - kms:Encrypt/Decrypt/GenerateDataKey → roles/ontrackchain-dev-sre + roles/ontrackchain-ci-runner
#        - kms:PutKeyPolicy → deny role:root exceto break-glass role (ADR-026 M5 Step02).
#   4. Copiar ARN real (ex: arn:aws:kms:sa-east-1:123456789012:key/abcd1234-...) e substituir
#      os placeholders REPLACE_WITH_ abaixo.
#   5. Substituir aws_profile: ontrackchain-prod pelo profile ~/.aws/credentials real.
#   6. PGP break-glass: substituir 2 fingerprints por chaves PGP reais DPO + CISO.
#      Comando: gpg --list-secret-keys --with-colons --fingerprint | grep fpr.
#   7. Validar: sops -e -i apps/ai-service/.env.dev → sops -d apps/ai-service/.env.dev.
# Referência: https://github.com/getsops/sops
#
# Objetivo: Criptografia envelope AES256-GCM de arquivos .env* (excluindo .env.sample)
#           em todo monorepo com chave KEK em KMS gerenciado + PGP break-glass DPO/CISO.
#           Custo total <$1.50 USD/ano AWS KMS sa-east-1.
#
# CMK Placeholder de bootstrap (Sprint 28+9.2 output sops_cmk_arn preencher):
---
creation_rules:
  # ============================================================
  # OPÇÃO 1 (RECOMENDADA Sprint 28+4): AWS KMS CMK (menor TCO)
  #   Custo anual aproximado: $1 CMK + $0.03/10k req + KMS free-tier
  #   Rotacionar automaticamente (anual). Key policy RBAC 4-olhos:
  #     - Allow: roles/ontrackchain-dev-sre (kms:Encrypt/Decrypt/GenerateDataKey)
  #     - Allow: roles/ontrackchain-ci-runner (kms:Decrypt/GenerateDataKey)
  #     - Deny: role:root (kms:PutKeyPolicy - exceto break-glass role ADR-026 M5)
  # ============================================================
  - path_regex: ^(.*/)?\.env(\.(dev|staging|prod))?(\.private)?$
    encrypted_regex: '^(.*_SECRET|.*_KEY|.*_TOKEN|.*_PASSWORD|OTK_PG_PASSWORD|STRIPE_API_KEY|STRIPE_WEBHOOK_SECRET|GROQ_API_KEY|INFURA_.*|ALCHEMY_.*|VAULT_.*|KMS_.*_ARN|CLIENT_SECRET|PRIVATE_KEY|SSH_.*_KEY|HSM_.*)$'
    kms: arn:aws:kms:sa-east-1:REPLACE_WITH_ACCOUNT_ID:key/REPLACE_WITH_SOPS_KMS_CMK_UUID
    aws_profile: ontrackchain-prod
    key_groups:
      - kms:
          - arn:aws:kms:sa-east-1:REPLACE_WITH_ACCOUNT_ID:key/REPLACE_WITH_SOPS_KMS_CMK_UUID
      - pgp:
          - REPLACE_WITH_PGP_FINGERPRINT_DPO_40HEX  # DPO break-glass (LGPD Art.48)
          - REPLACE_WITH_PGP_FINGERPRINT_CISO_40HEX # CISO break-glass (SecOps)

  # ============================================================
  # OPÇÃO 2: HashiCorp Vault Transit Engine (HSM on-prem OU CloudHSM)
  #   - transit engine path: transit/
  #   - key name: ontrackchain-sops-kek (AES256-GCM 96-bit nonce, rotacionável)
  #   - Vault policy "sops-writer" = transit/encrypt/ontrackchain-sops-kek
  #   - Vault policy "sops-reader" = transit/decrypt/ontrackchain-sops-kek
  #   - Shamir KEK shard 2-de-3 (DPO + CISO + CLO custodiam 1 shard cada)
  # ============================================================
  # - path_regex: ^(.*/)?\.env(\.(dev|staging|prod))?(\.private)?$
  #   encrypted_regex: '^(.*_SECRET|.*_KEY|.*_TOKEN|.*_PASSWORD|OTK_PG_PASSWORD|STRIPE_API_KEY|STRIPE_WEBHOOK_SECRET|GROQ_API_KEY|INFURA_.*|ALCHEMY_.*|VAULT_.*|KMS_.*_ARN|CLIENT_SECRET|PRIVATE_KEY|SSH_.*_KEY|HSM_.*)$'
  #   hc_vault_transit:
  #     - vault_address: https://vault.ontrackchain-internal.corp:8200
  #       engine_path: transit
  #       key_name: ontrackchain-sops-kek

# Arquivos NÃO criptografar (lista branca LGPD — samples e docs públicas ok)
unencrypted_suffix: _unencrypted

# Desabilitar MAC exclusão parcial em regex (modo estrito)
shamir_threshold: 2
shamir_total_shards: 3

# Output YAML com comments preservados (modo padrão)
lastmodified_format: '2006-01-02T15:04:05Z07:00'
