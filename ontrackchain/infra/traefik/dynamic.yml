http:
  middlewares:
    public-ratelimit:
      rateLimit:
        average: 10
        period: 1h

    auth:
      forwardAuth:
        address: "http://auth-service:9000/validate"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Org-Id"
          - "X-User-Id"
          - "X-Linked-User-Id"
          - "X-Plan"
          - "X-Role"
          - "X-Auth-Method"
          - "X-MFA-Mode"
          - "X-MFA-Provider-Homologated"

  routers:
    mock-oidc:
      entryPoints: ["web"]
      rule: "Host(`oidc.localhost`)"
      service: "mock-oidc"
      priority: 310

    keycloak:
      entryPoints: ["web"]
      rule: "Host(`auth.localhost`) || Host(`auth.ontrackchain.com`)"
      service: "keycloak"
      priority: 300

    auth:
      entryPoints: ["web"]
      rule: "PathPrefix(`/auth`)"
      service: "auth-service"
      priority: 200

    validate:
      entryPoints: ["web"]
      rule: "PathPrefix(`/validate`)"
      service: "auth-service"
      priority: 199

    team-auth:
      entryPoints: ["web"]
      rule: "PathPrefix(`/api/v1/team/`)"
      service: "auth-service"
      priority: 180

    health-auth:
      entryPoints: ["web"]
      rule: "PathPrefix(`/health`) && Method(`GET`)"
      service: "auth-service"
      priority: 170

    public:
      entryPoints: ["web"]
      rule: "PathPrefix(`/public`)"
      middlewares: ["public-ratelimit"]
      service: "public-api"
      priority: 150

    investigation:
      entryPoints: ["web"]
      rule: "PathPrefix(`/api/v1/investigation`)"
      middlewares: ["auth"]
      service: "investigation-api"
      priority: 150

    report-types:
      entryPoints: ["web"]
      rule: "PathPrefix(`/api/v1/report-types`)"
      middlewares: ["auth"]
      service: "investigation-api"
      priority: 150

    billing:
      entryPoints: ["web"]
      rule: "PathPrefix(`/api/v1/billing`)"
      middlewares: ["auth"]
      service: "investigation-api"
      priority: 150

    audit:
      entryPoints: ["web"]
      rule: "PathPrefix(`/api/v1/audit`)"
      middlewares: ["auth"]
      service: "investigation-api"
      priority: 150

    compliance:
      entryPoints: ["web"]
      rule: "PathPrefix(`/api/v1/compliance`) || PathPrefix(`/api/v1/operations`)"
      middlewares: ["auth"]
      service: "compliance-api"
      priority: 150

    ai:
      entryPoints: ["web"]
      rule: "PathPrefix(`/api/v1/ai`)"
      middlewares: ["auth"]
      service: "ai-service"
      priority: 150

    cases:
      entryPoints: ["web"]
      rule: "PathPrefix(`/api/v1/cases`)"
      middlewares: ["auth"]
      service: "case-management"
      priority: 150

    monitoring:
      entryPoints: ["web"]
      rule: "PathPrefix(`/api/v1/monitoring`)"
      middlewares: ["auth"]
      service: "monitoring-api"
      priority: 150

    reports:
      entryPoints: ["web"]
      rule: "PathPrefix(`/api/v1/reports`)"
      middlewares: ["auth"]
      service: "report-api"
      priority: 150

    frontend:
      entryPoints: ["web"]
      rule: "PathPrefix(`/`)"
      service: "frontend"
      priority: 1

  services:
    mock-oidc:
      loadBalancer:
        servers:
          - url: "http://mock-oidc:9101"

    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:8080"

    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth-service:9000"

    public-api:
      loadBalancer:
        servers:
          - url: "http://public-api:8000"

    investigation-api:
      loadBalancer:
        servers:
          - url: "http://investigation-api:8001"

    compliance-api:
      loadBalancer:
        servers:
          - url: "http://compliance-api:8002"

    ai-service:
      loadBalancer:
        servers:
          - url: "http://ai-service:8005"

    case-management:
      loadBalancer:
        servers:
          - url: "http://case-management:8006"

    monitoring-api:
      loadBalancer:
        servers:
          - url: "http://monitoring-api:8003"

    report-api:
      loadBalancer:
        servers:
          - url: "http://report-api:8004"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"
