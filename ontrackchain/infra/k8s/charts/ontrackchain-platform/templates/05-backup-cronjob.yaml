{{- /*
Ontrackchain Platform Helm Chart — T2-07 Sprint 18 (v3.1.0)
05-backup-cronjob.yaml — PG16 Daily Backup CronJob + PVC LGPD

Hard constraints (NÃO VIOLAR):
  - PodSecurity restricted (seccomp RuntimeDefault, allowPrivEsc:false, cap drop ALL, runAsNonRoot)
  - PVC com label LGPD: ontrackchain.io/lgpd-classification = restricted-dados-pessoais
  - ConcurrencyPolicy Forbid (nunca 2 backups rodando ao mesmo tempo)
  - Service postgres:5432 como target host (SSOT StatefulSet do 02-postgres)
  - Retenção configurável em values.backup.retentionDays (default 14)
*/ -}}
{{- if and .Values.backup.enabled .Values.postgres.enabled }}
---
# ======================================================
# PVC — Armazenamento Persistente de Backups (LGPD R.14)
# ======================================================
{{- if .Values.backup.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-daily-backups
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: postgres-backup
    # ---- LGPD LABEL OBRIGATÓRIO (PodSecurity restricted compliance RLS) ----
    ontrackchain.io/lgpd-classification: restricted-dados-pessoais
    # ---- Velero/Restic annotations opcional (backup em cloud cross-region):
    {{- with .Values.backup.persistence.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - {{ .Values.backup.persistence.accessMode | default "ReadWriteOnce" }}
  {{- with .Values.global.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size | default "20Gi" | quote }}
{{- end }}

---
# ======================================================
# CronJob — pg_dump diário (PG16 custom format)
# ======================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-daily-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: postgres-backup
spec:
  schedule: {{ .Values.backup.schedule | default "0 4 * * *" | quote }}
  timezone: {{ .Values.backup.timezone | default "UTC" | quote }}
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: {{ .Values.backup.history.success | default 3 }}
  failedJobsHistoryLimit: {{ .Values.backup.history.failed | default 2 }}
  startingDeadlineSeconds: {{ .Values.backup.startingDeadlineSeconds | default 900 }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backup.backoffLimit | default 2 }}
      ttlSecondsAfterFinished: {{ .Values.backup.ttlSecondsAfterFinished | default 604800 }}
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds | default 14400 }}
      template:
        metadata:
          labels:
            {{- include "ontrackchain.labels" . | nindent 12 }}
            ontrackchain.io/component: postgres-backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: default
          # ---- POD SECURITY STANDARD = RESTRICTED (OBRIGATÓRIO M8 CI PSP GATE) ----
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
          enableServiceLinks: false
          {{- with .Values.backup.nodeSelector }}
          nodeSelector: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.affinity }}
          affinity: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.tolerations }}
          tolerations: {{ toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: backup-storage
              {{- if .Values.backup.persistence.enabled }}
              persistentVolumeClaim:
                claimName: postgres-daily-backups
              {{- else }}
              emptyDir:
                sizeLimit: {{ .Values.backup.persistence.size | default "20Gi" }}
              {{- end }}
            - name: tmp-work
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
          containers:
            - name: pg-dump
              image: {{ .Values.backup.image | default "postgres:16-alpine" | quote }}
              imagePullPolicy: {{ .Values.global.imagePullPolicy }}
              # ---- PSP restricted container-level ----
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /bin/sh
                - -euc
                - |
                  # --- vars ---
                  RETENTION_DAYS="{{ .Values.backup.retentionDays | default 14 }}"
                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  OUTFILE="/backups/pg16-ontrackchain-${TS}.dump"
                  # 1. aplica retenção
                  echo "🧹 Cleaning backups older than ${RETENTION_DAYS}d in /backups"
                  find /backups -name 'pg16-ontrackchain-*.dump' -type f -mtime +${RETENTION_DAYS} -print -delete
                  # 2. executa pg_dump em FORMAT CUSTOM (-Fc) = restaurável via pg_restore
                  echo "💾 Starting pg_dump custom format → ${OUTFILE}"
                  pg_dump -Fc \
                    --host="${PGHOST}" \
                    --port="${PGPORT}" \
                    --username="${PGUSER}" \
                    --dbname="${PGDATABASE}" \
                    --no-owner \
                    --no-privileges \
                    --compress=6 \
                    --file="${OUTFILE}"
                  # 3. checksum SHA256 + stat output
                  SHA="$(sha256sum "${OUTFILE}" | awk '{print $1}')"
                  SIZE="$(stat -c%s "${OUTFILE}" 2>/dev/null || stat -f%z "${OUTFILE}")"
                  echo "✅ Backup COMPLETE: ${OUTFILE}"
                  echo "   sha256 = ${SHA}"
                  echo "   size_bytes = ${SIZE}"
                  echo "   retention_days = ${RETENTION_DAYS}"
                  # 4. mantém latest symlink (idempotente)
                  ln -sf "${OUTFILE}" /backups/pg16-ontrackchain-latest.dump
              envFrom:
                - secretRef:
                    # --- credenciais do PG16, mesmas usadas pelo StatefulSet (02-postgres) ---
                    name: postgres-credentials
              env:
                - name: PGHOST
                  value: "postgres.{{ .Release.Namespace }}.svc.cluster.local"
                - name: PGPORT
                  value: {{ .Values.postgres.port | default 5432 | quote }}
                - name: PGUSER
                  value: {{ .Values.postgres.username | default "ontrackchain" | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgres.database | default "ontrackchain" | quote }}
                - name: PGDATA
                  value: /var/lib/postgresql/data
                - name: HOME
                  value: /tmp-work
              resources:
                {{- toYaml (.Values.backup.resources | default (dict "requests" (dict "cpu" "200m" "memory" "512Mi") "limits" (dict "cpu" "1000m" "memory" "2Gi"))) | nindent 16 }}
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                  readOnly: false
                - name: tmp-work
                  mountPath: /tmp-work
                  readOnly: false
{{- end }}
