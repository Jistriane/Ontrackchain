apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted
  labels:
    app.kubernetes.io/part-of: ontrackchain
    compliance: lgpd-52
    encryption: aes-256-xts
    tier: p0-production
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    description: "EBS gp3 encrypted at rest via AWS KMS CMK (SOPS multi-tenant). LGPD Art.49 §6."
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  kmsKeyId: '{{ .Values.global.kmsKeyId | default "arn:aws:kms:REGION:ACCOUNT:key/REPLACE_WITH_SOPS_KMS_CMK_ID" }}'
  fsType: ext4
  iops: "4000"
  throughput: "1000"
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
mountOptions:
  - noatime
  - nodiratime
  - data=writeback
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted-ret
  labels:
    app.kubernetes.io/part-of: ontrackchain
    retention: retain
  annotations:
    description: "gp3 encrypted + retain policy para volumes PII (PG16 PV não deletado no helm uninstall)"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  kmsKeyId: '{{ .Values.global.kmsKeyId | default "arn:aws:kms:REGION:ACCOUNT:key/REPLACE_WITH_SOPS_KMS_CMK_ID" }}'
  fsType: ext4
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
mountOptions:
  - noatime
  - data=ordered
