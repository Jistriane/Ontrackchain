apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-provisioned
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ontrackchain
    app.kubernetes.io/component: grafana
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus (Ontrackchain Metrics)
        type: prometheus
        uid: prometheus-ontrackchain
        access: proxy
        url: '{{ .Values.observability.grafana.datasources.prometheus.url | default "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090" | quote  }}'
        isDefault: true
        jsonData:
          timeInterval: 15s
          httpMethod: POST
          prometheusType: Prometheus
          prometheusVersion: 2.54.0
          cacheLevel: High
          disableRecordingRules: false
          incrementalQueryOverlapWindow: 10m
          queryTimeout: 60s
        secureJsonData:
          httpHeaderValue1: ""  # Basic Auth se necessário; usar Token OAuth para prod
        editable: false
        version: 1

      - name: Loki (Ontrackchain Logs LGPD)
        type: loki
        uid: loki-ontrackchain
        access: proxy
        url: '{{ .Values.observability.grafana.datasources.loki.url | default "http://loki-gateway.observability.svc.cluster.local" | quote  }}'
        jsonData:
          timeout: 60
          maxLines: 5000
          derivedFields:
            - name: trace_id
              datasourceUid: tempo-ontrackchain
              matcherRegex: "\"trace_id\":\"?([0-9a-fA-F]{32})\"?"
              url: "$${__value.raw}"
            - name: Jaeger APM
              matcherRegex: "trace_id=([0-9a-f]{32})"
              url: "/explore?left=%7B%22datasource%22%3A%22tempo-ontrackchain%22%2C%22queries%22%3A%5B%7B%22query%22%3A%22%241%22%2C%22refId%22%3A%22A%22%7D%5D%7D"
        basicAuth: false
        withCredentials: false
        editable: false
        version: 1

      - name: Tempo (Ontrackchain Distributed Traces APM)
        type: tempo
        uid: tempo-ontrackchain
        access: proxy
        url: '{{ .Values.observability.grafana.datasources.tempo.url | default "http://tempo-query-frontend.observability.svc.cluster.local:3200" | quote  }}'
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki-ontrackchain
            spanStartTimeShift: "-1h"
            spanEndTimeShift: "1h"
            filterByTraceID: true
            filterBySpanID: true
            tags: [
              { key: "service.name", value: "service_name" },
              { key: "k8s.pod.name", value: "k8s_pod" }
            ]
          tracesToMetrics:
            datasourceUid: prometheus-ontrackchain
            tags: [
              { key: "service.name", value: "service_name" },
              { key: "service.environment", value: "service_environment" }
            ]
            queries:
              - name: "Latência 50p/99p p95 do span (múltimo trace root)"
                query: "histogram_quantile(0.99, sum(rate(duration_seconds_bucket{service_name=\"$${__span.serviceName}\"}[$__range])) by (le))"
          serviceMap:
            datasourceUid: prometheus-ontrackchain
          search:
            hide: false
          lokiSearch:
            datasourceUid: loki-ontrackchain
          nodeGraph:
            enabled: true
        editable: false
        version: 1

      - name: Splunk Observability Cloud (logs/metrics LGPD)
        type: splunk-observability
        uid: splunk-o11y-lgpd
        access: proxy
        url: "https://app.us1.signalfx.com"
        jsonData:
          org: '{{ .Values.observability.splunk.realm | default "us1" | quote  }}'
          tokenType: Direct
        secureJsonData:
          accessToken: "REPLACE_WITH_SPLUNK_O11Y_ACCESS_TOKEN_MONITORING_READONLY"
        isDefault: false
        editable: false
        version: 1

      - name: Alertmanager Cluster
        type: alertmanager
        uid: alertmanager-otk
        access: proxy
        url: '{{ .Values.observability.alertmanager.url | default "http://alertmanager-operated.observability.svc.cluster.local:9093" | quote  }}'
        jsonData:
          implementation: "prometheus-alertmanager"
          handleGrafanaManagedAlerts: false
          tlsAuth: false
          tlsSkipVerify: false
        version: 1
        editable: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ontrackchain
spec:
  replicas: '{{ .Values.observability.grafana.replicas | default 2 }}'
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  minReadySeconds: 15
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: ontrackchain
      annotations:
        checksum/datasources: "{{ include (print $.Template.BasePath \"/12-grafana-datasources-provisioned.yaml\") . | sha256sum }}"
    spec:
      serviceAccountName: grafana-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: '{{ .Values.observability.grafana.image | default "grafana/grafana:11.5.1-ubuntu" }}'
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: "/secrets/grafana-admin/password"
            - name: GF_SECURITY_SECRET_KEY__FILE
              value: "/secrets/grafana-admin/secret_key"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/tmp/dashboards/home-ontrackchain-lgpd.json"
            - name: GF_AUTH_GOOGLE_ENABLED
              value: "false"
            - name: GF_AUTH_OIDC_ENABLED
              value: "true"
            - name: GF_AUTH_OIDC_NAME
              value: "Ontrackchain Keycloak SSO"
            - name: GF_AUTH_OIDC_ISSUER_URL
              value: '{{ .Values.observability.grafana.oidc.issuerUrl | default "https://kc.ontrackchain.app/realms/ontrackchain" | quote  }}'
            - name: GF_AUTH_OIDC_CLIENT_ID
              value: "grafana-sso-oidc"
            - name: GF_AUTH_OIDC_CLIENT_SECRET__FILE
              value: "/secrets/grafana-oidc/client_secret"
            - name: GF_AUTH_OIDC_SCOPES
              value: "openid profile email roles"
            - name: GF_AUTH_OIDC_ROLE_ATTRIBUTE_PATH
              value: "contains(roles[*], 'OTK_ADMIN') && 'Admin' || contains(roles[*], 'OTK_COMPLIANCE_OFFICER') && 'Editor' || 'Viewer'"
            - name: GF_SERVER_ROOT_URL
              value: '{{ .Values.observability.grafana.rootUrl | default "https://grafana.ontrackchain.app" | quote  }}'
            - name: GF_LOG_MODE
              value: "console"
            - name: GF_LOG_LEVEL
              value: "info"
            - name: GF_LOG_ENCODING
              value: "json"
            - name: GF_SMTP_ENABLED
              value: "false"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            - name: GF_SECURITY_COOKIE_SAMESITE
              value: "strict"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards-json
              mountPath: /tmp/dashboards
              readOnly: true
            - name: grafana-admin-secret
              mountPath: /secrets/grafana-admin
              readOnly: true
            - name: grafana-oidc-secret
              mountPath: /secrets/grafana-oidc
              readOnly: true
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: false
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-datasources
          configMap:
            name: grafana-datasources-provisioned
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards-json
          configMap:
            name: grafana-default-dashboards
        - name: grafana-admin-secret
          secret:
            secretName: grafana-admin-credentials
        - name: grafana-oidc-secret
          secret:
            secretName: grafana-oidc-secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ontrackchain
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: gp3-encrypted
  resources:
    requests: { storage: 20Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ontrackchain
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: grafana }
  ports:
    - { port: 80, targetPort: 3000, name: http, protocol: TCP }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa
  namespace: observability
  labels: { app.kubernetes.io/part-of: ontrackchain }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: ontrackchain-default-dashboards
        orgId: 1
        folder: "Ontrackchain LGPD"
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 600
        allowUiUpdates: false
        options:
          path: /tmp/dashboards
          foldersFromFilesStructure: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-default-dashboards
  namespace: observability
data:
  home-ontrackchain-lgpd.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "id": null,
      "uid": "home-otk-lgpd",
      "title": "Ontrackchain LGPD Dashboard Principal",
      "tags": ["lgpd", "bacen", "home"],
      "timezone": "browser",
      "schemaVersion": 40,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {"type":"stat","title":"Status 9 Serviços FastAPI","datasource":{"uid":"prometheus-ontrackchain"},"gridPos":{"x":0,"y":0,"w":12,"h":4},
          "targets":[{"expr":"sum(up{job=~\"fastapi-services-.*\"})"}],
          "options": {"colorMode": "background"}},
        {"type":"timeseries","title":"Latência P95 endpoints FastAPI (segundos)","datasource":{"uid":"prometheus-ontrackchain"},"gridPos":{"x":12,"y":0,"w":12,"h":8},
          "targets":[{"expr":"histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"ontrackchain\"}[5m])) by (le, path))"}],
          "fieldConfig": {}},
        {"type":"logs","title":"Últimos Erros LGPD (Loki)","datasource":{"uid":"loki-ontrackchain"},"gridPos":{"x":0,"y":4,"w":12,"h":8},
          "targets":[{"expr":"{app_kubernetes_io_part_of=\"ontrackchain\"} |= `RBAC DENY` or `ERROR` or `LGPD VIOLATION` or `BACEN ALERTA` | json | line_format `{{.timestamp}} [{{.level}}] {{.msg}}`","limit":100}]
        },
        {"type":"stat","title":"Tokens JWT validados RBAC Guard 1h","datasource":{"uid":"prometheus-ontrackchain"},"gridPos":{"x":0,"y":12,"w":6,"h":4},
          "targets":[{"expr":"increase(rbac_guard_jwt_validations_total[1h])"}]},
        {"type":"stat","title":"Deny RBAC 403 últimos 30m","datasource":{"uid":"prometheus-ontrackchain"},"gridPos":{"x":6,"y":12,"w":6,"h":4},
          "targets":[{"expr":"increase(rbac_guard_rbac_denies_total[30m])"}],"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"steps":[{"color":"green","value":null},{"color":"red","value":1}]}}}}
      ]
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: observability
  labels: { app.kubernetes.io/part-of: ontrackchain }
type: Opaque
stringData:
  password: "REPLACE_WITH_GRAFANA_ADMIN_PASSWORD_M5_4EYES_STRONG_MIN20CHARS"
  secret_key: "REPLACE_WITH_GRAFANA_SECRET_KEY_32BYTES_MIN_HEX_OR_BASE64_M5"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-oidc-secret
  namespace: observability
  labels: { app.kubernetes.io/part-of: ontrackchain }
type: Opaque
stringData:
  client_secret: "REPLACE_WITH_GRAFANA_OIDC_CLIENT_SECRET_KEYCLOAK_REALM_CLIENT"
