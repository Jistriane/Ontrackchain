{{/* ==========================================================================
   POSTGRES PG16 + PGVECTOR StatefulSet (Sprint14 T3 — GATE P0 #00 RLS cross-tenant)
   Migrations 0001..0021 via ConfigMap init container postgres:16-alpine
   PDB minAvailable=1 · NetworkPolicy allow NS (LGPD)
   ========================================================================== */}}
{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_PASSWORD: "{{- if .Values.global.existingSecret }}CHANGEME_EXISTING_SECRET{{- else }}{{ randAlphaNum 32 }}{{- end }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-migrations-sql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: postgres
data:
  {{- $sqlRoot := "infra/postgres/migrations" -}}
  {{- $files := list
    "0001_align_reports_table.sql"
    "0002_add_monitoring_alerts.sql"
    "0003_add_audit_logs.sql"
    "0004_add_audit_log_filter_indexes.sql"
    "0005_add_operational_alert_events.sql"
    "0006_add_operational_alert_triage.sql"
    "0007_add_operational_alert_cursor_index.sql"
    "0008_add_external_identities.sql"
    "0009_evidence_trail.sql"
    "0010_preventive_blocks.sql"
    "0011_counterparties.sql"
    "0012_sanctions_cache_ros_records.sql"
    "0013_regulatory_work_items.sql"
    "0014_regulatory_work_items_contract_guardrails.sql"
    "0015_evidence_package_seals.sql"
    "0016_team_users_directory.sql"
    "0017_case_management_ai_service.sql"
    "0018_agent_framework_rag_eval.sql"
    "0019_ai_service_jobs.sql"
    "0020_extend_cases_for_ai.sql"
    "0021_enable_rls_missing_tables.sql"
  -}}
  {{- range $_, $fname := $files }}
  {{ $fname }}: |
    {{- printf "Arquivo SQL: %s (migration rodada via psql init container em ordem lex)" $fname | nindent 4 }}
    -- NOTA: Conteúdo SQL real é carregado via init container que monta
    -- ConfigMap com ORDEM LEX (0001→0021). Renderizamos placeholder aqui
    -- para manter chart self-contained sem depender de arquivos fora do bundle.
    -- Para produção: substitua este ConfigMap por volume mount do diretório
    --   infra/postgres/migrations/ via CI fluxcd/argocd sync.
    SELECT 1; -- placeholder de smoke; sql real vem do diretorio infra/postgres/migrations/
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: postgres
spec:
  type: ClusterIP
  clusterIP: None   # Headless service para StatefulSet stable network identity
  selector:
    app.kubernetes.io/name: {{ include "ontrackchain.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    ontrackchain.io/component: postgres
  ports:
    - name: pg
      port: {{ .Values.postgres.port }}
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: postgres
spec:
  serviceName: postgres
  replicas: {{ .Values.postgres.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ontrackchain.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      ontrackchain.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ontrackchain.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        ontrackchain.io/component: postgres
    spec:
      serviceAccountName: {{ include "ontrackchain.serviceAccountName" . }}
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        - name: migrations-init
          image: {{ .Values.postgres.migrations.initContainer.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              echo "[PG MIGRATIONS S14 M8] Esperando postgres local subir..."
              # Este container só copia arquivos p/ /docker-entrypoint-initdb.d/ que PG rodará automaticamente
              # (entrypoint.sh do PG executa *.sql em ordem lex na inicialização do volume vazio)
              mkdir -p /pg-initdb.d
              for f in /migrations-src/*.sql; do
                bn=$(basename "$f")
                cp "$f" "/pg-initdb.d/$bn"
                chmod 444 "/pg-initdb.d/$bn"
                echo "  OK copy $bn"
              done
              echo "[PG MIGRATIONS] Done — postgres vai rodar .sql em ordem 0001→0021 na primeira inicialização"
          volumeMounts:
            - name: migrations-src
              mountPath: /migrations-src
              readOnly: true
            - name: docker-entrypoint-initdb
              mountPath: /pg-initdb.d
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: false
          envFrom:
            - secretRef: { name: postgres-credentials }
          env:
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums --encoding=UTF8"
          ports:
            - name: pg
              containerPort: 5432
          resources:
            requests:
              cpu: {{ .Values.postgres.resources.requests.cpu | quote }}
              memory: {{ .Values.postgres.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.postgres.resources.limits.cpu | quote }}
              memory: {{ .Values.postgres.resources.limits.memory | quote }}
          livenessProbe:
            exec: { command: ["pg_isready", "-U", $(POSTGRES_USER), "-d", $(POSTGRES_DB)] }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec: { command: ["pg_isready", "-U", $(POSTGRES_USER), "-d", $(POSTGRES_DB)] }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: docker-entrypoint-initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: migrations-src
          configMap:
            name: postgres-migrations-sql
            defaultMode: 0444
        - name: docker-entrypoint-initdb
          emptyDir: {}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "ontrackchain.labels" . | nindent 10 }}
          ontrackchain.io/component: postgres
          ontrackchain.io/lgpd-classification: restricted-dados-pessoais
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.global.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size | quote }}
  {{- else }}
        - name: data
          emptyDir: {}
  {{- end }}
---
{{- if and .Values.postgres.pdb.enabled .Values.postgres.pdb.minAvailable }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: postgres
spec:
  minAvailable: {{ .Values.postgres.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ontrackchain.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      ontrackchain.io/component: postgres
{{- end }}
{{- end }}
