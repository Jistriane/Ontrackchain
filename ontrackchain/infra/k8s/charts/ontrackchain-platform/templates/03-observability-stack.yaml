{{/* ==========================================================================
   OBSERVABILIDADE Sprint14 T4: Prometheus + Grafana + Alertmanager + ServiceMonitors
   M4 Grafana dashboards provisionados, M3 Prometheus 3 regras + 5 extra
   Prometheus Federation pronto (metrics scraper de /metrics 9 FastAPI M16b)
   ========================================================================== */}}
{{- if .Values.observability.enabled }}
---
{{- if .Values.observability.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: ontrackchain-{{ .Values.global.environment }}
        environment: {{ .Values.global.environment }}
    rule_files:
      - "/etc/prometheus/rules/*.yml"
    scrape_configs:
      - job_name: 'fastapi-services-m16b'
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: {{ .Release.Namespace }}
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(:\d+)?;(\d+)
            replacement: $1:$3
            target_label: __address__
      - job_name: 'kubernetes-service-endpoints'
        kubernetes_sd_configs: [{ role: endpoints }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
  platform.rules.yml: |
    {{- tpl (.Files.Get "files/platform.rules.yml" | default "") . | nindent 4 }}
{{- end }}
---
{{- if .Values.observability.prometheus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "ontrackchain.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    ontrackchain.io/component: prometheus
  ports:
    - name: web
      port: {{ .Values.observability.prometheus.port }}
      targetPort: 9090
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: prometheus
spec:
  serviceName: prometheus
  replicas: {{ .Values.observability.prometheus.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ontrackchain.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      ontrackchain.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ontrackchain.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        ontrackchain.io/component: prometheus
    spec:
      serviceAccountName: {{ include "ontrackchain.serviceAccountName" . }}
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: false
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.observability.prometheus.retention }}"
            - "--web.enable-lifecycle"
            - "--web.enable-admin-api"
            - "--web.external-url=/prometheus"
            - "--web.route-prefix=/"
          ports:
            - name: web
              containerPort: 9090
          resources:
            requests:
              cpu: {{ .Values.observability.prometheus.resources.requests.cpu | quote }}
              memory: {{ .Values.observability.prometheus.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.observability.prometheus.resources.limits.cpu | quote }}
              memory: {{ .Values.observability.prometheus.resources.limits.memory | quote }}
          livenessProbe:
            httpGet: { path: "/-/healthy", port: 9090 }
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: "/-/ready", port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap: { name: prometheus-config, items: [{ key: prometheus.yml, path: prometheus.yml }] }
        - name: rules
          emptyDir: {}
        {{- if not .Values.observability.prometheus.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.observability.prometheus.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "ontrackchain.labels" . | nindent 10 }}
          ontrackchain.io/component: prometheus
          ontrackchain.io/lgpd-classification: restricted-dados-pessoais
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.global.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.observability.prometheus.persistence.size | quote }}
  {{- end }}
---
{{- if .Values.observability.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ontrackchain-fastapi-services
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  namespaceSelector: { matchNames: [{{ .Release.Namespace }}] }
  selector:
    matchExpressions:
      - key: ontrackchain.io/component
        operator: In
        values: ["case-management","auth-service","ai-service","investigation-api","mock-oidc","public-api","monitoring-api","compliance-api","report-api","postgres","prometheus","grafana","alertmanager","keycloak","traefik"]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.observability.serviceMonitor.interval }}
      honorLabels: true
    - port: pg
      interval: 60s
      path: /metrics
      scheme: http
{{- end }}
{{- end }}
---
{{- if .Values.observability.grafana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "ontrackchain.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    ontrackchain.io/component: grafana
  ports:
    - name: http
      port: {{ .Values.observability.grafana.port }}
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: grafana
spec:
  replicas: {{ .Values.observability.grafana.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ontrackchain.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      ontrackchain.io/component: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ontrackchain.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        ontrackchain.io/component: grafana
    spec:
      serviceAccountName: {{ include "ontrackchain.serviceAccountName" . }}
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: false
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.observability.grafana.adminUser | quote }}
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_INSTALL_PLUGINS
              value: "grafana-piechart-panel,yesoreyeram-boomtable-panel"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: {{ .Values.observability.grafana.resources.requests.cpu | quote }}
              memory: {{ .Values.observability.grafana.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.observability.grafana.resources.limits.cpu | quote }}
              memory: {{ .Values.observability.grafana.resources.limits.memory | quote }}
          livenessProbe:
            httpGet: { path: "/grafana/api/health", port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: "/grafana/api/health", port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        {{- if .Values.observability.grafana.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
{{- if .Values.observability.grafana.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: grafana
    ontrackchain.io/lgpd-classification: restricted-dados-pessoais
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.global.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.observability.grafana.persistence.size | quote }}
{{- end }}
{{- end }}
---
{{- if .Values.observability.alertmanager.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: alertmanager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "ontrackchain.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    ontrackchain.io/component: alertmanager
  ports:
    - name: web
      port: {{ .Values.observability.alertmanager.port }}
      targetPort: 9093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontrackchain.labels" . | nindent 4 }}
    ontrackchain.io/component: alertmanager
spec:
  replicas: {{ .Values.observability.alertmanager.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ontrackchain.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      ontrackchain.io/component: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ontrackchain.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        ontrackchain.io/component: alertmanager
    spec:
      serviceAccountName: {{ include "ontrackchain.serviceAccountName" . }}
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: {{ .Values.observability.alertmanager.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: false
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--web.external-url=/alertmanager"
            - "--web.route-prefix=/"
          ports:
            - name: web
              containerPort: 9093
          resources:
            requests:
              cpu: {{ .Values.observability.alertmanager.resources.requests.cpu | quote }}
              memory: {{ .Values.observability.alertmanager.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.observability.alertmanager.resources.limits.cpu | quote }}
              memory: {{ .Values.observability.alertmanager.resources.limits.memory | quote }}
          livenessProbe:
            httpGet: { path: "/-/healthy", port: 9093 }
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: "/-/ready", port: 9093 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: storage
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap: { name: alertmanager-config, optional: true }
        - name: storage
          emptyDir: {}
{{- end }}
{{- end }}
