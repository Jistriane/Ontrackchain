apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: ontrackchain
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-daemonset-conf
  namespace: observability
  labels:
    app.kubernetes.io/component: otel-collector
data:
  otel-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            auth:
              authenticator: basicauth/server
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins: ["https://*.ontrackchain.app", "http://localhost:*"]
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          disk: {}
          filesystem: {}
          load: {}
          memory: {}
          network: {}
          paging: {}
      kubeletstats:
        auth_type: serviceAccount
        collection_interval: 45s
        endpoint: "${env:KUBELET_ENDPOINT}"
        insecure_skip_verify: true
      filelog:
        include: ["/var/log/pods/*/*/*.log"]
        exclude: ["/var/log/pods/*_observability_*/*.log"]
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - id: get-format-detector
            type: router
            routes:
              - output: parser-json-structured
                expr: 'body matches "^\\{\"'
          - id: parser-json-structured
            type: json_parser
            parse_from: body
            output: extract-attrs
          - id: extract-attrs
            type: metadata
            attributes:
              k8s.pod.name: EXPR(env("POD_NAME"))
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 5m
      prometheus:
        config:
          scrape_configs:
            - job_name: 'fastapi-services-800x'
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: true
                  action: keep
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
                  target_label: __address__
                  regex: (.+)
                  replacement: $$1:$$1
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: k8s_namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: k8s_pod
    extensions:
      basicauth/server:
        htpasswd:
          inline: |
            oteluser:$2y$10$REPLACE_WITH_HTPASSWD_FROM_HTPASSWD_CMD
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: 0.0.0.0:1777
      zpages:
        endpoint: 0.0.0.0:55679

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
        send_batch_max_size: 2048
      memory_limiter:
        check_interval: 1s
        limit_percentage: 70
        spike_limit_percentage: 20
      k8sattributes:
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
            - k8s.namespace.name
          labels:
            - tag_name: app
              key: app.kubernetes.io/name
              from: pod
        pod_association:
          - sources: [{"from": "resource_attribute", "name": "k8s.pod.ip"}]
          - sources: [{"from": "resource_attribute", "name": "k8s.pod.uid"}]
          - sources: [{"from": "connection"}]
      resourcedetection:
        detectors: [env, system, ec2, eks, gcp, azure]
        timeout: 10s
        override: false
      resource:
        attributes:
          - key: service.environment
            value: '{{ .Values.global.environment | default "staging" | quote  }}'
            action: upsert
          - key: deployment.environment
            value: '{{ .Values.global.environment | default "staging" | quote  }}'
            action: upsert
          - key: compliance.lgpd
            value: "art49-s6"
            action: upsert
          - key: host.name
            from_attribute: host.name
            action: insert
      attributes:
        actions:
          - key: user.pii
            value: redacted
            action: insert
          - pattern: "^(email|cpf|cnpj|rg|endereco|telefone|celular)$$"
            action: hash
            hash: SHA-256
      tail_sampling:
        policies:
          - name: always-sample-errors
            type: status_code
            status_code: { status_codes: [ERROR] }
          - name: probabilistic-20pct-healthy
            type: probabilistic
            probabilistic: { sampling_percentage: 20 }

    exporters:
      splunk_hec/logs:
        token: "${SPLUNK_HEC_TOKEN}"
        endpoint: '{{ .Values.observability.splunk.hec.endpoint | default "https://http-inputs-ontrackchain.splunkcloud.com:443/services/collector/event" }}'
        index: '{{ .Values.observability.splunk.hec.logsIndex | default "ontrackchain_lgpd_logs" }}'
        source: otel-collector-daemonset
        sourcetype: _json
        tls:
          insecure_skip_verify: false
          max_version: "TLS1_3"
          min_version: "TLS1_2"
        max_connections: 100
        max_content_length_log2: 22
        sending_queue:
          enabled: true
          storage: file_storage/logs
          num_consumers: 10
          queue_size: 100000
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 60s
          max_elapsed_time: 30m
      splunk_hec/metrics:
        token: "${SPLUNK_HEC_TOKEN}"
        endpoint: "{{ .Values.observability.splunk.hec.endpoint }}"
        index: '{{ .Values.observability.splunk.hec.metricsIndex | default "ontrackchain_metrics" }}'
        source: otel-collector-metrics
        tls:
          insecure_skip_verify: false
          min_version: "TLS1_2"
        sending_queue:
          enabled: true
          storage: file_storage/metrics
        retry_on_failure:
          enabled: true
      splunk_hec/traces:
        token: "${SPLUNK_HEC_TOKEN}"
        endpoint: "{{ .Values.observability.splunk.hec.endpoint }}"
        index: '{{ .Values.observability.splunk.hec.tracesIndex | default "ontrackchain_apm_traces" }}'
        source: otel-collector-traces
        sending_queue:
          enabled: true
          storage: file_storage/traces
        retry_on_failure:
          enabled: true
          max_elapsed_time: 1h
      prometheusremotewrite:
        endpoint: '{{ .Values.observability.prometheus.remoteWrite.url | default "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/write" }}'
        add_metric_suffixes: true
        resource_to_telemetry_conversion:
          enabled: true
        target_info:
          enabled: true
        tls:
          insecure: true
        external_labels:
          cluster: '{{ .Values.global.clusterName | default "ontrackchain-main" }}'
          env: '{{ .Values.global.environment | default "staging" | quote  }}'
        sending_queue:
          enabled: true
          storage: file_storage/prom-rw
      logging:
        verbosity: normal
        sampling_initial: 5
        sampling_thereafter: 200
      loki:
        endpoint: '{{ .Values.observability.loki.endpoint | default "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push" }}'
        tls:
          insecure: true
        default_labels_enabled:
          exporter: true
          job: true
        headers:
          X-Scope-OrgID: '{{ .Values.global.environment | default "staging" }}'
      otlp/tempo:
        endpoint: '{{ .Values.observability.tempo.endpoint | default "tempo-distributor.observability.svc.cluster.local:4317" }}'
        tls:
          insecure: true
        sending_queue:
          enabled: true
        retry_on_failure:
          enabled: true

    extensions:
      file_storage/logs:
        directory: /var/lib/otelcol/logs
        timeout: 10s
        compaction:
          directory: /var/lib/otelcol/logs
          on_start: true
          on_rebound: true
          rebound_needed_threshold_mib: 100
          rebound_trigger_threshold_mib: 20
      file_storage/metrics:
        directory: /var/lib/otelcol/metrics
        timeout: 10s
        compaction:
          on_start: true
      file_storage/traces:
        directory: /var/lib/otelcol/traces
        timeout: 10s
      file_storage/prom-rw:
        directory: /var/lib/otelcol/prom-rw
        timeout: 10s

    service:
      extensions: [health_check, pprof, zpages, basicauth/server, file_storage/logs, file_storage/metrics, file_storage/traces, file_storage/prom-rw]
      pipelines:
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource, attributes, batch]
          exporters: [splunk_hec/logs, loki, logging]
        metrics:
          receivers: [otlp, hostmetrics, prometheus, kubeletstats]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource, batch]
          exporters: [splunk_hec/metrics, prometheusremotewrite]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource, tail_sampling, batch]
          exporters: [splunk_hec/traces, otlp/tempo]
      telemetry:
        logs:
          level: info
          encoding: json
        metrics:
          address: 0.0.0.0:8888
          level: detailed
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector-daemonset
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ontrackchain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: ontrackchain
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        checksum/config: "{{ include (print $.Template.BasePath \"/00-storageclass-gp3-encrypted.yaml\") . | sha256sum | trunc 64 }}"
    spec:
      serviceAccountName: otel-collector-agent
      terminationGracePeriodSeconds: 180
      priorityClassName: system-node-critical
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: '{{ .Values.observability.otel.image | default "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.120.0" }}'
          imagePullPolicy: IfNotPresent
          command:
            - /otelcol-contrib
            - --config=/etc/otel/otel-config.yaml
            - --feature-gates=component.UseLocalHostAsDefaultHost
          args: []
          ports:
            - name: otlp-grpc
              containerPort: 4317
              hostPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              hostPort: 4318
              protocol: TCP
            - name: zpages
              containerPort: 55679
              protocol: TCP
            - name: pprof
              containerPort: 1777
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: KUBELET_ENDPOINT
              value: "https://$(NODE_IP):10250"
            - name: NODE_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: splunk-hec-token
                  key: token
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
              ephemeral-storage: 20Gi
          livenessProbe:
            httpGet: { path: /, port: 13133 }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /, port: 13133 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            privileged: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: varlibotelcol
              mountPath: /var/lib/otelcol
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: otel-config
          configMap:
            name: otel-collector-daemonset-conf
            items:
              - key: otel-config.yaml
                path: otel-config.yaml
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
        - name: varlibotelcol
          hostPath:
            path: /var/lib/otelcol
            type: DirectoryOrCreate
        - name: hostfs
          hostPath:
            path: /
            type: Directory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-agent
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ontrackchain
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT:role/ontrackchain-otel-splunk-observability"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-agent-role
  labels:
    app.kubernetes.io/part-of: ontrackchain
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/stats", "nodes/metrics", "nodes/proxy", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["daemonsets", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-agent-role
subjects:
  - kind: ServiceAccount
    name: otel-collector-agent
    namespace: observability
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-collector-ds-pdb
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ontrackchain
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
---
apiVersion: v1
kind: Secret
metadata:
  name: splunk-hec-token
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ontrackchain
type: Opaque
stringData:
  token: "REPLACE_WITH_SPLUNK_HEC_TOKEN_LGPD_PROD_4EYES"
