# =============================================================================
# Ontrackchain Platform Helm Values (SSOT Milestone Pós-MVP 8 Sprint14)
# 9 serviços FastAPI + PG16 PGVector + Observabilidade + Keycloak + Traefik
# Leia ADR-018 docs/adrs/ antes de editar (RLS cross-tenant enforce_admins=true)
# =============================================================================

global:
  environment: staging                  # staging / production-canary / production (M5 Environments)
  imagePullPolicy: IfNotPresent
  imageRegistry: ghcr.io                # Trocar por registry real (Render / ECR / Artifact Registry)
  imageTag: "3.0.0"                     # AppVersion — bater com Chart.yaml
  storageClass: "gp3-encrypted"          # AES-256 EBS gp3 via AWS KMS CMK (S28+9 SC customizado, LGPD Art.49§6)
  kmsKeyId: "REPLACE_WITH_SOPS_KMS_CMK_ARN_PROD"
  lgpd:
    max_sample_percent_non_prod: 5      # LGPD RIPD Art.52 — nunca 100% fora prod sem AES256 (M16 DR)
  serviceMesh:
    enabled: false                      # Istio/Linkerd opcional (Milestone P3 futuro Chaos Mesh)
  # Secrets (todos REPLACE_WITH_ no cadastro UI — 4-eyes obrigatório, ADR018 R12)
  existingSecret: ""                    # Se existente, ignora secrets abaixo
  secrets:
    database_url: "REPLACE_WITH_DATABASE_URL_PG16_PGVECTOR"
    signing_key_jwt: "REPLACE_WITH_SIGNING_KEY_JWT_ES256"
    oidc_client_secret: "REPLACE_WITH_OIDC_CLIENT_SECRET_KEYCLOAK"
    ai_api_key_openai: "REPLACE_WITH_AI_API_KEY_OPENAI_SK"
    aws_access_key_id: "REPLACE_WITH_AWS_ACCESS_KEY_ID_DR_M16"
    aws_secret_access_key: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY_DR_M16"
    render_api_token: "REPLACE_WITH_RENDER_API_TOKEN_PROD_4EYES"
    healthchecks_io_sla_uuid: "REPLACE_WITH_HEALTHCHECKS_IO_SLA_UUID_M9"
    healthchecks_io_loadtest_uuid: "REPLACE_WITH_HEALTHCHECKS_IO_LOADTEST_UUID_M11"
    healthchecks_io_dr_uuid: "REPLACE_WITH_HEALTHCHECKS_IO_DR_UUID_M16"
    sonar_token: "REPLACE_WITH_SONAR_TOKEN_M8"
    codecov_token: "REPLACE_WITH_CODECOV_TOKEN_M8"

# =============================================================================
# 9 SERVIÇOS FASTAPI (M16b GATE OBSERVABILIDADE: /healthz e /metrics OBRIGATÓRIOS)
# =============================================================================
services:
  case-management:
    enabled: true
    replicas: 2
    version: "2.0.0"
    port: 8001
    autoscaling: { enabled: true, min: 2, max: 6, targetCPU: 70, targetMemory: 75 }
    pdb: { enabled: true, minAvailable: 1 }
    resources: { requests: { cpu: "300m", memory: "512Mi" }, limits: { cpu: "1000m", memory: "1536Mi" } }
    env:
      APP_MODULE: "case_management.main:app"
      RLS_SHARED_FIRST: "1"
    probes:
      liveness:  { path: "/healthz", port: "http", initialDelaySeconds: 15, periodSeconds: 20, timeoutSeconds: 3 }
      readiness: { path: "/healthz", port: "http", initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 3 }

  auth-service:
    enabled: true
    replicas: 3
    version: "3.0.0"
    port: 8002
    autoscaling: { enabled: true, min: 3, max: 10, targetCPU: 65, targetMemory: 70 }
    pdb: { enabled: true, minAvailable: 2 }
    resources: { requests: { cpu: "500m", memory: "768Mi" }, limits: { cpu: "1500m", memory: "2Gi" } }
    env:
      APP_MODULE: "auth_service.main:app"
      OIDC_ENABLED: "1"
    probes:
      liveness:  { path: "/healthz", port: "http", initialDelaySeconds: 20, periodSeconds: 20, timeoutSeconds: 3 }
      readiness: { path: "/healthz", port: "http", initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 3 }

  ai-service:
    enabled: true
    replicas: 2
    version: "4.1.0"
    port: 8003
    autoscaling: { enabled: true, min: 2, max: 8, targetCPU: 75, targetMemory: 80 }
    pdb: { enabled: true, minAvailable: 1 }
    resources: { requests: { cpu: "1000m", memory: "2Gi" }, limits: { cpu: "3000m", memory: "6Gi" } }
    env:
      APP_MODULE: "ai_service.main:app"
      RAG_PGVECTOR_ENABLED: "1"
    probes:
      liveness:  { path: "/healthz", port: "http", initialDelaySeconds: 30, periodSeconds: 25, timeoutSeconds: 5 }
      readiness: { path: "/healthz", port: "http", initialDelaySeconds: 20, periodSeconds: 15, timeoutSeconds: 4 }

  investigation-api:
    enabled: true
    replicas: 2
    version: "2.0.0"
    port: 8004
    autoscaling: { enabled: true, min: 2, max: 6, targetCPU: 70, targetMemory: 75 }
    pdb: { enabled: true, minAvailable: 1 }
    resources: { requests: { cpu: "400m", memory: "768Mi" }, limits: { cpu: "1200m", memory: "2Gi" } }
    env:
      APP_MODULE: "investigation_api.main:app"
    probes:
      liveness:  { path: "/healthz", port: "http", initialDelaySeconds: 20, periodSeconds: 20, timeoutSeconds: 3 }
      readiness: { path: "/healthz", port: "http", initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 3 }

  mock-oidc:
    enabled: true
    replicas: 1
    version: "1.5.0"
    port: 8005
    autoscaling: { enabled: false, min: 1, max: 1 }
    pdb: { enabled: false, minAvailable: 0 }
    resources: { requests: { cpu: "100m", memory: "256Mi" }, limits: { cpu: "300m", memory: "512Mi" } }
    env:
      APP_MODULE: "mock_oidc.main:app"
      DEV_MODE: "1"
    probes:
      liveness:  { path: "/healthz", port: "http", initialDelaySeconds: 10, periodSeconds: 30, timeoutSeconds: 3 }
      readiness: { path: "/healthz", port: "http", initialDelaySeconds: 5,  periodSeconds: 15, timeoutSeconds: 3 }

  public-api:
    enabled: true
    replicas: 4
    version: "2.0.0"
    port: 8006
    autoscaling: { enabled: true, min: 4, max: 16, targetCPU: 60, targetMemory: 70 }
    pdb: { enabled: true, minAvailable: 3 }
    resources: { requests: { cpu: "250m", memory: "384Mi" }, limits: { cpu: "800m", memory: "1Gi" } }
    env:
      APP_MODULE: "public_api.main:app"
      RATE_LIMIT_PER_MIN: "120"
    probes:
      liveness:  { path: "/healthz", port: "http", initialDelaySeconds: 15, periodSeconds: 15, timeoutSeconds: 2 }
      readiness: { path: "/healthz", port: "http", initialDelaySeconds: 8,  periodSeconds: 8,  timeoutSeconds: 2 }

  monitoring-api:
    enabled: true
    replicas: 2
    version: "2.0.0"
    port: 8007
    autoscaling: { enabled: true, min: 2, max: 5, targetCPU: 65, targetMemory: 70 }
    pdb: { enabled: true, minAvailable: 1 }
    resources: { requests: { cpu: "200m", memory: "384Mi" }, limits: { cpu: "700m", memory: "1Gi" } }
    env:
      APP_MODULE: "monitoring_api.main:app"
      PROMETHEUS_METRICS_ENABLED: "1"
    probes:
      liveness:  { path: "/healthz", port: "http", initialDelaySeconds: 15, periodSeconds: 20, timeoutSeconds: 3 }
      readiness: { path: "/healthz", port: "http", initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 3 }

  compliance-api:
    enabled: true
    replicas: 2
    version: "2.0.0"
    port: 8008
    autoscaling: { enabled: true, min: 2, max: 6, targetCPU: 65, targetMemory: 75 }
    pdb: { enabled: true, minAvailable: 1 }
    resources: { requests: { cpu: "300m", memory: "512Mi" }, limits: { cpu: "1000m", memory: "1536Mi" } }
    env:
      APP_MODULE: "compliance_api.main:app"
      SANCTIONS_CHECK_ENABLED: "1"
    probes:
      liveness:  { path: "/healthz", port: "http", initialDelaySeconds: 20, periodSeconds: 20, timeoutSeconds: 3 }
      readiness: { path: "/healthz", port: "http", initialDelaySeconds: 12, periodSeconds: 10, timeoutSeconds: 3 }

  report-api:
    enabled: true
    replicas: 2
    version: "2.0.0"
    port: 8009
    autoscaling: { enabled: true, min: 2, max: 6, targetCPU: 70, targetMemory: 75 }
    pdb: { enabled: true, minAvailable: 1 }
    resources: { requests: { cpu: "350m", memory: "640Mi" }, limits: { cpu: "1200m", memory: "2Gi" } }
    env:
      APP_MODULE: "report_api.main:app"
      PDF_GENERATOR_MAX_PROCS: "2"
    probes:
      liveness:  { path: "/healthz", port: "http", initialDelaySeconds: 20, periodSeconds: 25, timeoutSeconds: 4 }
      readiness: { path: "/healthz", port: "http", initialDelaySeconds: 12, periodSeconds: 12, timeoutSeconds: 3 }

# =============================================================================
# POSTGRES PG16 + PGVECTOR (RLS cross-tenant P0 GATE #00)
# =============================================================================
postgres:
  enabled: true
  image: "pgvector/pgvector:pg16"
  replicas: 1                            # StatefulSet único (ha é Milestone futuro P3 Patroni)
  port: 5432
  username: ontrackchain
  database: ontrackchain
  persistence:
    enabled: true
    size: 10Gi
  resources: { requests: { cpu: "500m", memory: "1Gi" }, limits: { cpu: "2000m", memory: "4Gi" } }
  migrations:
    enabled: true
    initContainer:
      image: "postgres:16-alpine"
      sqlDir: "infra/postgres/migrations"   # Montado via ConfigMap Sprint 6..13
  networkPolicy:
    allowFromNamespaceOnly: true            # RLS cross-tenant: só pods do mesmo NS
  pdb: { enabled: true, minAvailable: 1 }

# =============================================================================
# PG16 DAILY BACKUP (T2-07 Sprint 18 Helm v3.1.0 — DR M16 Nativo K8s)
# =============================================================================
backup:
  enabled: true
  image: "postgres:16-alpine"
  # Horário: 04:00 UTC = 01:00 AM BRST / 02:00 BRT (janela de menor tráfego)
  schedule: "0 4 * * *"
  timezone: "UTC"
  # Retenção 14 dias padrão (RIPD Art.15 — LGPD prazo mínimo pra contestação)
  retentionDays: 14
  startingDeadlineSeconds: 900
  backoffLimit: 2
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 604800
  history:
    success: 3
    failed: 2
  persistence:
    enabled: true
    # Label LGPD OBRIGATÓRIO no template 05-backup-cronjob PVC: restricted-dados-pessoais
    size: 20Gi
    accessMode: ReadWriteOnce
    # Annotations Velero/Restic (DR cross-region):
    additionalAnnotations:
      backup.velero.io/backup-volumes: backup-storage
      pre.hook.backup.velero.io/timeout: 10m
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  nodeSelector: {}
  affinity: {}
  tolerations: []

# =============================================================================
# OBSERVABILIDADE (M4 Prometheus + Grafana Dashboards 6 + Alertmanager)
# =============================================================================
observability:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: "15s"
  clusterName: "ontrackchain-main"
  splunk:
    hec:
      endpoint: "https://http-inputs-ontrackchain.splunkcloud.com:443/services/collector/event"
      tokenRef: { secretName: splunk-hec-token, key: token }
      logsIndex: "ontrackchain_lgpd_logs"
      metricsIndex: "ontrackchain_metrics"
      tracesIndex: "ontrackchain_apm_traces"
    realm: "us1"
  prometheus:
    enabled: true
    image: "prom/prometheus:v2.53.0"
    port: 9090
    retention: "30d"
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
    resources: { requests: { cpu: "500m", memory: "1Gi" }, limits: { cpu: "2000m", memory: "4Gi" } }
    remoteWrite:
      url: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/write"
    rules:
      - "platform.rules.yml"
      - "investigation.rules.yml"
      - "compliance.rules.yml"
      - "monitoring.rules.yml"
      - "report.rules.yml"
  otel:
    enabled: true
    image: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.120.0"
    piiHashAlg: "SHA-256"
    tailSamplingHealthyPct: 20
    retryMaxElapsedMinutes: 30
  loki:
    enabled: true
    endpoint: "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
  tempo:
    enabled: true
    endpoint: "tempo-distributor.observability.svc.cluster.local:4317"
    queryEndpoint: "http://tempo-query-frontend.observability.svc.cluster.local:3200"
  grafana:
    enabled: true
    image: "grafana/grafana:11.5.1-ubuntu"
    port: 3000
    replicas: 2
    adminUser: "admin"
    rootUrl: "https://grafana.ontrackchain.app"
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "gp3-encrypted"
    resources: { requests: { cpu: "200m", memory: "512Mi" }, limits: { cpu: "1000m", memory: "1Gi" } }
    oidc:
      issuerUrl: "https://kc.ontrackchain.app/realms/ontrackchain"
      clientId: "grafana-sso-oidc"
      clientSecretRef: { secretName: grafana-oidc-secret, key: client_secret }
    adminCredentialsRef:
      passwordKey: password
      secretKeyKey: secret_key
      secretName: grafana-admin-credentials
    datasources:
      prometheus:
        url: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090"
      loki:
        url: "http://loki-gateway.observability.svc.cluster.local"
      tempo:
        url: "http://tempo-query-frontend.observability.svc.cluster.local:3200"
    dashboards:
      - "ontrackchain-qa-overview.json"
      - "investigation-operations.json"
      - "compliance-operations.json"
      - "monitoring-operations.json"
      - "report-operations.json"
      - "platform-alerting.json"
  alertmanager:
    enabled: true
    image: "prom/alertmanager:v0.27.0"
    port: 9093
    replicas: 1
    url: "http://alertmanager-operated.observability.svc.cluster.local:9093"
    resources: { requests: { cpu: "100m", memory: "256Mi" }, limits: { cpu: "400m", memory: "512Mi" } }
    deadMansSwitch:
      healthchecks_io_uuid_ref: "global.secrets.healthchecks_io_sla_uuid"

# =============================================================================
# KEYCLOAK IAM (OIDC + RBAC — GATE P0 #01 OIDC)
# =============================================================================
keycloak:
  enabled: true
  image: "quay.io/keycloak/keycloak:25.0.2"
  port: 8080
  replicas: 2
  realmImportJson: "files/realm-ontrackchain.json"
  resources: { requests: { cpu: "500m", memory: "1Gi" }, limits: { cpu: "2000m", memory: "2Gi" } }
  pdb: { enabled: true, minAvailable: 1 }

# =============================================================================
# TRAEFIK INGRESS CONTROLLER (Ingress v1 padrão k8s)
# =============================================================================
traefik:
  enabled: true
  image: "traefik:v3.1.4"
  replicas: 3
  serviceType: "LoadBalancer"
  pdb: { enabled: true, minAvailable: 2 }
  resources: { requests: { cpu: "300m", memory: "384Mi" }, limits: { cpu: "1200m", memory: "1Gi" } }
  ingressClass: "ontrackchain-traefik"
  hosts:
    - host: "staging.ontrackchain.local"
      paths:
        - { path: "/api/v0/case",       service: "case-management",  port: 8001 }
        - { path: "/api/v0/auth",       service: "auth-service",     port: 8002 }
        - { path: "/api/v0/ai",         service: "ai-service",       port: 8003 }
        - { path: "/api/v0/invest",     service: "investigation-api",port: 8004 }
        - { path: "/api/v0/mock-oidc",  service: "mock-oidc",        port: 8005 }
        - { path: "/api/v0/public",     service: "public-api",       port: 8006 }
        - { path: "/api/v0/monitoring", service: "monitoring-api",   port: 8007 }
        - { path: "/api/v0/compliance", service: "compliance-api",   port: 8008 }
        - { path: "/api/v0/report",     service: "report-api",       port: 8009 }
        - { path: "/auth",              service: "keycloak",         port: 8080 }
        - { path: "/grafana",           service: "grafana",          port: 3000 }
        - { path: "/prometheus",        service: "prometheus",       port: 9090, protected: true }
        - { path: "/alertmanager",      service: "alertmanager",     port: 9093, protected: true }
  tls:
    enabled: true
    certIssuer: "letsencrypt-staging"    # Trocar para letsencrypt-prod em produção

# =============================================================================
# NETWORK POLICY LGPD + RLS CROSS-TENANT (padrão fechado)
# =============================================================================
networkPolicy:
  defaultDenyAllIngress: true            # Nenhum tráfego permitido por padrão
  allowIntraNamespace: true              # Pods no NS ontrackchain conversam
  allowFromIngressNamespace:
    enabled: true
    ingressNs: "ingress-traefik"
  denyEgressToMetadata: true             # Bloqueia 169.254.169.254 (IMDS cloud)
  denyEgressToPublic:
    enabled: false
    whitelistCidrs:
      - "0.0.0.0/0"                      # Abrir para AI APIs, S3 LGPD, etc

serviceAccount:
  create: true
  automount: true
  annotations: {}
