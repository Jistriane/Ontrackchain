[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontrackchain-case-management"
version = "0.1.0"
description = "Enhanced Case Management Service with AI Integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
