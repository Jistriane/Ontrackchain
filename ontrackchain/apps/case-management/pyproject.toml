[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontrackchain-case-management"
version = "0.2.0"
description = "Case Management Service with PostgreSQL persistence, RBAC, and Evidence Trail"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "psycopg_pool>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
