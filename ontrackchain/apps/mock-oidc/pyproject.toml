[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "ontrackchain-mock-oidc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.1",
  "pyjwt[crypto]>=2.9.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.3.4",
  "ontrackchain-shared @ file://../../packages/shared",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mock_oidc"]
