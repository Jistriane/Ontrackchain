[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "ontrackchain-report-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.3.4",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "reportlab>=4.2.2",
  "weasyprint>=62.3",
  "psycopg[binary]>=3.2.1",
  "psycopg-pool>=3.2.2",
  "redis[asyncio,hiredis]>=5.0.7",
  "PyJWT>=2.9.0",
  "ontrackchain-shared @ file://../../packages/shared",
]

[tool.hatch.build.targets.wheel]
packages = ["src/report_api"]
