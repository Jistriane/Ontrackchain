[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontrackchain-ai-service"
version = "0.3.0"
description = "AI Service for Explainable AI, Graph Intelligence, and Agent Framework v4.0 — Production"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "psycopg_pool>=3.2.0",
    "httpx>=0.27.0",
    "ontrackchain-agents>=0.1.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40.0",
    "groq>=0.12.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]
