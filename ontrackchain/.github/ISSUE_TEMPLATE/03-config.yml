## Mudança
<Descreva a alteração desejada com exatidão (ex: "adicionar como Required Status Check no branch `main`: `sast-bandit-python`, `dependency-audit-pip`, `qa-gateway-cli-smoke` para bloquear merge").>

## Justificativa
<Por que essa mudança reduz risco, custo ou acelera entrega? (Ex: "Sprint 7 M1 elevou GAP#12 para bloqueante; sem required status checks um PR pode ser mergeado com CVE HIGH.")>

## Validação Esperada
- `[ ] Após aplicar: merge de PR teste com label `do-not-merge` é RECUSADO pelos 3 status checks acima.`
