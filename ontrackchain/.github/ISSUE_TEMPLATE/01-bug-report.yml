## Evidências
- `[ ] Screenshot / screen-rec`
- `[ ] Logs service (auth/case/inv em deploy-staging ou deploy-production rollbacked?)`
- `[ ] QA Gateway: `qa-gateway scan-rls --database-url $DB_URL --failures-json /tmp/rls.json`
- `[ ] QA Gateway: `qa-gateway scan-rbac --apps-root apps/ --database-url $DB_URL`

## Critérios de Aceite (Definition of Done para BUG)
- `[ ] Root cause confirmado e documentado (RLS? middleware? fallback inline vs shared divergente? RPC?)`
- `[ ] Teste de regressão em `tests/` (RLS cross-tenant A/B tem teste P0 obrigatório para bugs deste tipo)`
- `[ ] CI verde (ci.yml 9 jobs, pytest 7 serviços, qa-gateway 6 comandos --help, bandit, pip-audit)`
- `[ ] E2E Playwright rodou (se aplicável) — PR tem label `e2e-required` adicionado?`
- `[ ] Revisor de segurança = label `needs-security-review` se tocou RLS, RBAC, middleware, secrets`
