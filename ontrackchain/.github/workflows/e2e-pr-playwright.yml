name: E2E Playwright em PRs (Docker Compose + 4 serviços + Navegador Chromium)
# -----------------------------------------------------------------------
# GAP #6 (Arquitetura QA/DevOps) — E2E Cypress/Playwright em todos PRs
# GAP #6 Sprint 6 upgrade: label "e2e-required" OBRIGATÓRIA em PR para
#        rodar shards=8; evita custo de ~8 runners em PRs pequenos docs
#
# Gatilhos:
#   A) pull_request (padrão) aberto ou atualizado contra main
#      → SÓ RODA SE (1) paths front/stack alterados AND (2) PR tem label
#         "e2e-required" OU é PR tipo ready_for_review pela primeira vez
#   B) push para develop/main (RODA SEMPRE — guardrail merge safety)
#   C) workflow_dispatch (manual)
#
# Pilares:
# 1. [Sprint 6 NOVO] Label-gate: em PRs (não push), exige etiqueta
#    `e2e-required` criada pelo revisor/QA; se ausente → skip amigável
# 2. Só roda se arquivos de código do front/serviços de negócio forem
#    alterados (filtro paths + dorny/paths-filter)
# 3. Docker Compose up: postgres + redis + traefik + auth + case + inv
# 4. Playwright shard=8 paralelo (40min→5min esperado) 4 testes de smoke
#    caminho crítico (login CRUD caso atribuir status exportar evidência)
# 5. SE 2+ testes falharem → BLOQUEIA MERGE; upload merged artifact 60d
# -----------------------------------------------------------------------
on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "apps/frontend/**"
      - "apps/case-management/**"
      - "apps/auth-service/**"
      - "apps/investigation-api/**"
      - "apps/monitoring-api/**"
      - "apps/compliance-api/**"
      - "apps/report-api/**"
      - "packages/**"
      - "infra/**"
      - ".github/workflows/e2e-pr-playwright.yml"
      - "docker-compose*.yml"
      - "render.yaml"
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: "Playwright test suite para rodar (--grep)"
        required: false
        type: string
        default: "critical-path|rbac|showcase-auth|api-consumer"
      shard:
        description: "Número de shards para paralelizar (1..8)"
        required: false
        type: string
        default: "1"
      shard_index:
        description: "Qual shard rodar? (ignorado se shard=1)"
        required: false
        type: string
        default: "1"

concurrency:
  group: e2e-playwright-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  COMPOSE_HTTP_TIMEOUT: 180
  BASE_URL: http://localhost:8080
  AUTH_MODE: dev
  DEV_AUTH_ENABLED: "true"
  JWT_HS256_SECRET: "ci-playwright-mock-secret-5216c64fe0a9897ad5e9b"
  MFA_TOTP_SECRET: "JBSWY3DPEHPK3PXP"
  PLAYWRIGHT_WORKERS: 4
  PLAYWRIGHT_TIMEOUT: 60000

jobs:
  # ---------------------------------------------------------------------
  # 0. Skip check: se PR só tocou docs OU NÃO TEM label 'e2e-required',
  #    pula sem custo (Sprint 6 NOVO label-gate evita 8 runners desnecessários)
  # ---------------------------------------------------------------------
  changed-file-filter:
    name: "0. Filtro paths + label e2e-required — só roda se código + etiqueta"
    runs-on: ubuntu-latest
    outputs:
      front_changed: ${{ steps.filter.outputs.front }}
      stack_changed: ${{ steps.filter.outputs.stack }}
      has_e2e_label: ${{ steps.check_label.outputs.has_e2e_label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: "[Sprint 6 NOVO] Verifica se PR tem label 'e2e-required'; push/dispatch = auto true"
        id: check_label
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_e2e_label=true" >> "$GITHUB_OUTPUT"
            echo "✅ Evento ${{ github.event_name }}: label-gate desligado (push/dispatch sempre roda)"
            exit 0
          fi
          LABELS_JSON='${{ toJSON(github.event.pull_request.labels) }}'
          TEM_LABEL=$(python3 -c "import json,sys
          try:
            labels = json.loads(sys.argv[1])
            names = [l.get('name','') for l in labels] if isinstance(labels,list) else []
            print('true' if 'e2e-required' in names else 'false')
          except Exception:
            print('false')
          " "$LABELS_JSON")
          echo "has_e2e_label=$TEM_LABEL" >> "$GITHUB_OUTPUT"
          if [ "$TEM_LABEL" = "true" ]; then
             echo "✅ PR #${{ github.event.pull_request.number || '0' }} tem label 'e2e-required': E2E HABILITADO"
          else
             echo "⚠️  PR #${{ github.event.pull_request.number || '0' }} SEM label 'e2e-required': SKIPPANDO E2E (economia ~8×5min runners)"
             echo "   → Como habilitar: revisor/QA adiciona label 'e2e-required' no PR → workflow dispara synchronize novamente"
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            front:
              - 'apps/frontend/**'
            stack:
              - 'apps/case-management/**'
              - 'apps/auth-service/**'
              - 'apps/investigation-api/**'
              - 'packages/**'
              - 'infra/**'
              - 'docker-compose*.yml'
              - 'render.yaml'
              - '.github/workflows/e2e-pr-playwright.yml'

  # ---------------------------------------------------------------------
  # 1. Docker Compose up + inicialização ORG/USER + gera playwright report
  # ---------------------------------------------------------------------
  e2e-playwright:
    name: "1. E2E Playwright shard=${{ matrix.shard }}/8 (PR / develop / main)"
    needs: [changed-file-filter]
    if: |
      (needs.changed-file-filter.outputs.front_changed == 'true' || needs.changed-file-filter.outputs.stack_changed == 'true' || github.event_name == 'workflow_dispatch')
      &&
      (needs.changed-file-filter.outputs.has_e2e_label == 'true')
    # Sprint 7 M4: self-hosted E2E runner primeiro (economia minutos GH Actions para shard=8)
    runs-on:
      - self-hosted
      - ontrackchain-ci-e2e-ubuntu-latest
      - ontrackchain
      - linux
      - x64
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ontrackchain
          POSTGRES_PASSWORD: ontrackchain
          POSTGRES_DB: ontrackchain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ontrackchain -d ontrackchain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar migrations init.sql + 0001..0021
        env:
          ONTRACKCHAIN_DATABASE_URL: postgresql://ontrackchain:ontrackchain@localhost:5432/ontrackchain
        run: |
          pip install -q --no-cache-dir psycopg[binary]
          cat infra/postgres/init.sql > /tmp/all.sql
          for f in $(ls -1 infra/postgres/migrations/*.sql 2>/dev/null | sort); do cat "$f" >> /tmp/all.sql; done
          echo "import psycopg, os" > /tmp/_mig.py
          echo "with psycopg.connect(os.environ['ONTRACKCHAIN_DATABASE_URL']) as conn:" >> /tmp/_mig.py
          echo "    conn.autocommit = True" >> /tmp/_mig.py
          echo "    conn.cursor().execute(open('/tmp/all.sql').read())" >> /tmp/_mig.py
          echo "print('migrations OK')" >> /tmp/_mig.py
          python3 /tmp/_mig.py

      - name: Build front (apps/frontend) para servir bundle pelo docker
        working-directory: apps/frontend
        timeout-minutes: 15
        run: |
          # Tenta usar cache actions/cache node. Se falhar (faltando arquivo package.json?), emite warn e pula
          if [ ! -f package.json ]; then
             echo "⚠️  apps/frontend/package.json não existe — pulando build frontend (pode ser PoC sem front)"
             echo "FRONT_BUILT=0" >> "$GITHUB_ENV"
             exit 0
          fi
          echo "Instalando front deps + build..."
          (corepack enable || true)
          (npm install -g pnpm@9 || npm install -g pnpm@latest || echo "pnpm indisponivel tenta npm")
          if command -v pnpm >/dev/null; then
            pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile || echo "pnpm falhou tenta npm"
          fi
          if [ -f package-lock.json ]; then npm ci || npm install; fi
          (npm run build 2>&1 | tail -40) || echo "build falhou — rodando E2E em modo dev server"
          echo "FRONT_BUILT=1" >> "$GITHUB_ENV"

      - name: Subir stack Docker Compose (postgres do service já existe — desliga postgres compose)
        timeout-minutes: 20
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          AUTH_MODE=dev
          DEV_AUTH_ENABLED=true
          JWT_HS256_SECRET=$JWT_HS256_SECRET
          MFA_TOTP_SECRET=$MFA_TOTP_SECRET
          MFA_TOTP_ISSUER="CI Playwright Mock"
          MFA_TOTP_ACCOUNT_NAME="ci-admin@ontrackchain.local"
          INVESTIGATION_INTERNAL_METRICS_ENABLED=false
          INVESTIGATION_RPC_ENABLED=false
          EOF
          # Não queremos subir postgres duplicado. Patch compose (override):
          docker compose up -d traefik redis
          sleep 3
          docker compose up -d --build auth-service case-management investigation-api 2>&1 | tail -20
          for i in $(seq 1 60); do
             sleep 4
             HA=$(curl -s -o /dev/null -w "%{http_code}" $BASE_URL/auth/healthz || echo 0)
             HC=$(curl -s -o /dev/null -w "%{http_code}" $BASE_URL/api/v1/cases/healthz || echo 0)
             HI=$(curl -s -o /dev/null -w "%{http_code}" $BASE_URL/health || echo 0)
             echo "  ready-check $i: auth=$HA case=$HC inv=$HI"
             if [ "$HA" = "200" ] && [ "$HC" = "200" ] && [ "$HI" = "200" ]; then
                echo "✅ Stack pronta após ${i} tentativas"; break
             fi
             if [ "$i" = "60" ]; then echo "❌ stack não pronta em 4min → abortar"; docker compose logs --tail 120; exit 2; fi
          done

      - name: "Bootstrap: ORG + USER ADMIN CI + dev-token"
        id: bootstrap
        run: |
          ORG=$(python3 -c "import uuid; print(uuid.uuid4())")
          USR=$(python3 -c "import uuid; print(uuid.uuid4())")
          DB=postgresql://ontrackchain:ontrackchain@localhost:5432/ontrackchain
          echo "import psycopg, os" > /tmp/_bootstrap.py
          echo "o = os.environ['ORG_ID_X']" >> /tmp/_bootstrap.py
          echo "u = os.environ['USR_ID_X']" >> /tmp/_bootstrap.py
          echo "with psycopg.connect(os.environ['DB_URL_X']) as c:" >> /tmp/_bootstrap.py
          echo "    c.autocommit = True" >> /tmp/_bootstrap.py
          echo "    with c.cursor() as cur:" >> /tmp/_bootstrap.py
          echo "        cur.execute(\"SET app.organization_id = %s\", (o,))" >> /tmp/_bootstrap.py
          echo "        cur.execute(\"INSERT INTO organizations (id,name,created_at,updated_at,credits_available,plan) VALUES (%s,%s,NOW(),NOW(),9999,%s) ON CONFLICT DO NOTHING\", (o, \"CI Playwright Org\", \"professional\"))" >> /tmp/_bootstrap.py
          echo "        cur.execute(\"INSERT INTO users (id,organization_id,email,role,status,created_at,updated_at) VALUES (%s,%s,%s,%s,%s,NOW(),NOW()) ON CONFLICT DO NOTHING\", (u, o, \"admin-ci@ontrackchain.local\", \"ADMIN\", \"active\"))" >> /tmp/_bootstrap.py
          ORG_ID_X="$ORG" USR_ID_X="$USR" DB_URL_X="$DB" python3 /tmp/_bootstrap.py
          TOK=$(curl -sS -X POST -H "Content-Type: application/json" \
            -d '{"email":"admin-ci@ontrackchain.local","role":"ADMIN","organization_id":"'"$ORG"'","user_id":"'"$USR"'"}' \
            $BASE_URL/auth/dev-token | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token','NO_TOKEN'))")
          if [ "$TOK" = "NO_TOKEN" ]; then
             echo "❌ /auth/dev-token falhou → abortar"; docker compose logs --tail 80 auth-service; exit 3
          fi
          echo "::add-mask::$TOK"
          echo "dev_token=$TOK" >> "$GITHUB_OUTPUT"
          echo "org_id=$ORG" >> "$GITHUB_OUTPUT"

      - name: Playwright install (browsers + OS deps)
        working-directory: apps/frontend
        run: |
          if [ ! -f package.json ]; then echo "⚠️ front não existe — pulando Playwright"; exit 0; fi
          # Usa playwright fornecido pelo projeto ou instala se não existir
          if command -v pnpm >/dev/null; then
             pnpm exec playwright --version 2>/dev/null || pnpm add -D @playwright/test@latest 2>/dev/null || true
          fi
          npx --yes playwright@latest install --with-deps chromium

      - name: Run Playwright — caminho crítico (shard=${{ matrix.shard }}/8)
        working-directory: apps/frontend
        env:
          CI_ADMIN_ORG_ID: ${{ steps.bootstrap.outputs.org_id }}
          CI_ADMIN_TOKEN: ${{ steps.bootstrap.outputs.dev_token }}
          SUITE: ${{ github.event.inputs.suite || 'critical-path|rbac|showcase-auth|api-consumer' }}
          SHARD: "8"
          SHARD_INDEX: "${{ matrix.shard }}"
        timeout-minutes: 25
        run: |
          if [ ! -f package.json ]; then
             echo "⚠️  Frontend ausente (apenas stack backend testando). smoke test curl + dev-token:"
             curl -sS "$BASE_URL/api/v1/cases/" -H "Authorization: Bearer $CI_ADMIN_TOKEN" -H "X-Organization-Id: $CI_ADMIN_ORG_ID" | head -c 400; echo
             echo "✅ smoke OK — marcando job como sucesso";
             exit 0
          fi
          # Cria playwright.config se não existir (MVP default Chromium CI)
          if [ ! -f playwright.config.ts ] && [ ! -f playwright.config.js ]; then
            cat > playwright.config.ci.mjs <<'CFG'
            import { defineConfig, devices } from '@playwright/test';
            export default defineConfig({
              use: { baseURL: process.env.BASE_URL || 'http://localhost:8080', headless: true },
              projects: [{ name: 'chromium', use: devices['Desktop Chrome'] }],
              retries: 2,
              timeout: 60000,
              reporter: [['list'], ['html', { open: 'never' }], ['json', { outputFile: 'playwright-report/report.json' }]],
              testDir: 'tests/e2e',
            });
          CFG
            PWCFG="-c playwright.config.ci.mjs"
          fi
          CMD="npx --yes playwright test --grep \"$SUITE\" --workers $PLAYWRIGHT_WORKERS --timeout $PLAYWRIGHT_TIMEOUT --reporter=list,html,json --output=playwright-report"
          if [ "$SHARD" -gt 1 ]; then CMD="$CMD --shard=$SHARD_INDEX/$SHARD"; fi
          echo "Rodando: $CMD $PWCFG"
          bash -c "$CMD $PWCFG" || EXIT=$?
          if [ "${EXIT:-0}" -ne 0 ]; then
             echo "❌ Playwright com falhas (exit $EXIT). Tentando upload de traces mesmo assim."
          fi
          echo "PLAYWRIGHT_EXIT=${EXIT:-0}" >> "$GITHUB_ENV"

      - name: "Upload artifacts: playwright report + HTML traces (shard ${{ matrix.shard }}/8)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-pr${{ github.event.pull_request.number || '0' }}-shard${{ matrix.shard }}
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true

  # ---------------------------------------------------------------------
  # 2. Merge reports shards 1..8 em 1 único playwright-report (via actions/upload-artifact merge)
  # ---------------------------------------------------------------------
  e2e-merge-and-comment:
    name: "2. Merge Playwright reports shards + comentário PR"
    needs: [e2e-playwright]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: "Download merged playwright reports (v4 merge-all)"
        uses: actions/upload-artifact/merge@v4
        with:
          name: playwright-${{ github.run_id }}-pr${{ github.event.pull_request.number || '0' }}-merged
          pattern: playwright-${{ github.run_id }}-pr${{ github.event.pull_request.number || '0' }}-shard*
          retention-days: 60
          separate-directories: false
          delete-merged: true

      - name: "Comentário PR final: status merged + link artifacts"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const ok = "${{ needs.e2e-playwright.result }}" === "success";
            const status = ok ? "✅ Todos shards (1/8..8/8) PASSARAM" : "❌ AO MENOS 1 shard Playwright FALHOU (ver logs shard X)";
            const link = `<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## E2E Playwright — Relatório Final (8 shards)\\n\\n- **Status**: ${status}\\n- [Download merged report + traces shards 1..8](${link})\\n\\n_Comentário automático e2e-pr-playwright.yml job merge-and-comment._`,
            });
        continue-on-error: true

