name: CI — Lint & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # Sprint S28+25.1 Hatch venv cache (~/.local/share/hatch, ~/.cache/hatch)
      # Economiza ~2-3 min por build ao não reinstalar pacotes do monorepo inteiro.
      # Cache key = hash de TODOS pyproject.toml + python version (hardcoded 3.11 neste job).
      # ============================================================
      - name: Cache Hatch environments + pip packages (Sprint S28+25)
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/hatch
            ~/.cache/hatch
            ~/.cache/pip
          key: hatch-venv-${{ runner.os }}-py3.11-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            hatch-venv-${{ runner.os }}-py3.11-
            hatch-venv-${{ runner.os }}-
          fail-on-cache-miss: false

      - name: Install ruff + hatch (Sprint S28+25: hatch disponivel)
        run: pip install ruff hatch

      - name: Lint with ruff
        run: |
          ruff check packages/agents/src/ apps/ai-service/src/ scripts/
          ruff format --check packages/agents/src/ apps/ai-service/src/ scripts/

  # ============================================================================
  # Sprint 11 M12: sbom-cyclonedx-grype BLOQUEANTE (vulnerabilidades HIGH/CRITICAL)
  # SBOM = Software Bill of Materials. CycloneDX = ISO/IEC 5962:2021 padrão.
  #   1) Syft gera 2 SBOMs: (a) Python lockfile requirements.txt (todas deps)
  #                          (b) imagem Docker ai-service:ci se buildada
  #   2) Grype lê SBOMs e compara com Grype DB: se HIGH+CRITICAL > 0 → BLOQUEIA MERGE
  # ============================================================================
  sbom-cyclonedx-grype:
    name: "SBOM + Grype scan: HIGH/CRITICAL (BLOQUEIA MERGE Sprint 11 M12)"
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 12
    continue-on-error: false
    env:
      GRYPE_DB_CACHE_DIR: /tmp/grype_cache
      SYFT_CACHE_DIR: /tmp/syft_cache
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: "1/4 Cache Grype DB (1 semana = evita download 1GB por run)"
        uses: actions/cache@v4
        with:
          path: /tmp/grype_cache
          key: grypedb-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            grypedb-${{ runner.os }}-
          fail-on-cache-miss: false

      - name: "2/4 Gerar SBOM Python CycloneDX (apps + packages = 7 roots, formato SPDX -> CycloneDX JSON)"
        run: |
          set -euo pipefail
          mkdir -p sbom/
          ROOTS="apps/case-management apps/auth-service apps/investigation-api apps/ai-service packages/shared packages/qa-gateway packages/agents"
          # Usa syft imagem Docker oficial open source (sem license)
          docker run --rm -v "$(pwd):/work:rw" -w /work \
            anchore/syft:v1.12.2 \
              packages /work \
              --output cyclonedx-json=/work/sbom/sbom-python-monorepo.cdx.json \
              --scope all-layers 2>&1 | tail -20
          echo "✅ SBOM Python gerado:"
          ls -la sbom/
          wc -l sbom/sbom-python-monorepo.cdx.json

      - name: "3/4 Grype: Scan SBOM (Python) vulnerabilidades CVE HIGH/CRITICAL > 0 = BLOQUEIA"
        id: grype_scan
        run: |
          set -euo pipefail
          mkdir -p grype_reports/
          docker run --rm \
            -v "$(pwd)/sbom:/sbom:ro" \
            -v "$(pwd)/grype_reports:/out:rw" \
            -v /tmp/grype_cache:/cache:rw \
            -e GRYPE_DB_CACHE_DIR=/cache \
            anchore/grype:v0.80.1 \
              sbom:/sbom/sbom-python-monorepo.cdx.json \
              --output table --output template \
              --add-cpes-if-none --fail-on high \
              --file /out/grype-py-report.txt 2>&1 | tail -30 || \
          (
            echo "❌ GRYPE FAIL: vulnerabilidades HIGH ou CRITICAL encontradas em sbom-python-monorepo.cdx.json"
            echo "   Relatório salvo em grype-reports/grype-py-report.txt."
            echo "   Para resolver: pip-audit (Sprint 7 M1) identifica pacotes; atualizar requirements/ Hatch pyproject.toml."
            exit 10
          )
          # Se --fail-on high passou, verifica relatório de verdade.
          echo "✅ Grype: ZERO vulnerabilidades HIGH / CRITICAL. Passou."

      - name: "4/4 Upload artifacts SBOM + Grype report (90d retenção regulatória)"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-grype-${{ github.sha }}
          path: |
            sbom/*.cdx.json
            grype_reports/*
          retention-days: 90

  # ============================================================================
  # Sprint 13 M16b: Gate Observabilidade ENDPOINTS obrigatórios FastAPI (BLOQUEANTE)
  # TODO service apps/<nome>/src/<nome>/main.py precisa expor:
  #   - "/healthz"  → liveness probe (k8s restart container se falhar)
  #   - "/metrics"  → Prometheus scraper (Grafana alerts M4)
  # 2 maneiras de violar = Falha.
  # ============================================================================
  observability-endpoints-gate:
    name: "Gate Observabilidade: FastAPI /healthz + /metrics obrigatórios (bloqueia)"
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 8
    continue-on-error: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: "(Obs 1/2) Scan apps/*/src/*/main.py — grep /healthz e /metrics se tem FastAPI() (sem Python, sem heredoc = 0 ScannerError)"
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          TOT_FAST=0; TOT_OK=0; ERROS=""
          APPS=$(find apps -type f -path "*/src/*/main.py" -maxdepth 4 2>/dev/null | sort || true)
          echo "Arquivos main.py encontrados em apps/:"
          echo "$APPS" | sed 's/^/  - /'
          for F in $APPS; do
            if ! grep -q "FastAPI(" "$F" 2>/dev/null; then
              echo "  ℹ️  $F: não declara FastAPI() → pula (provavelmente utilitário)."
              continue
            fi
            TOT_FAST=$((TOT_FAST+1))
            HZ="NO"; MT="NO"
            grep -qE '"/healthz"|'/healthz'|route.*healthz' "$F" 2>/dev/null && HZ="YES"
            grep -qE '"/metrics"|'/metrics'|instrumentator|prometheus.*expose' "$F" 2>/dev/null && MT="YES"
            if [ "$HZ" = "YES" ] && [ "$MT" = "YES" ]; then
              echo "  ✅ $F: FastAPI + /healthz + /metrics (ok)"
              TOT_OK=$((TOT_OK+1))
            else
              echo "  ❌ $F: FastAPI SEM endpoints (healthz=$HZ, metrics=$MT)"
              ERROS="${ERROS}${F}: healthz=$HZ metrics=$MT\n"
            fi
          done
          echo "tot_fastapi=$TOT_FAST" >> "$GITHUB_OUTPUT"
          echo "tot_ok=$TOT_OK" >> "$GITHUB_OUTPUT"
          if [ "$TOT_FAST" -gt 0 ] && [ "$TOT_OK" = "$TOT_FAST" ]; then
            echo "RESULTADO: PASSOU ($TOT_OK/$TOT_FAST)"
          elif [ "$TOT_FAST" -eq 0 ]; then
            echo "ℹ️ Nenhum serviço FastAPI detectado ainda (early stage) → gate passa por vacuidade."
          else
            printf "ERROS DETECTADOS (M16b Sprint 13 BLOQUEIO enforce_admins=true):\n%s" "$ERROS"
            exit 16
          fi

      - name: "(Obs 2/2) Step Summary markdown evidência auditoria"
        if: always()
        shell: bash
        run: |
          {
            echo "## M16b Gate Observabilidade (Sprint 13)"
            echo "- **Regra:** Apps FastAPI \`apps/*/src/*/main.py\` com \`FastAPI()\` → obrigatório rotas \`/healthz\` + \`/metrics\`."
            echo "- **Rationale:** k8s liveness probe restart automático 5s crashloop; Prometheus metrics → Grafana alert M4 platform.rules.yml"
            echo "- Serviços FastAPI detectados: **${{ steps.scan.outputs.tot_fastapi }}**, OK: **${{ steps.scan.outputs.tot_ok }}**"
          } >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Sprint 10 M10: policy-gate-conftest OPA (BLOQUEANTE 2min)
  # 4 policies Rego em policies/ (01..04 Sprint 13):
  #   #1 NUNCA transformar gate P0 em continue-on-error=true
  #   #2 Jobs pesados NÃO usam ubuntu-latest (Sprint 7 M4)
  #   #3 TODO job CI tem timeout-minutes explícito (anti 6h infinito)
  #   #4 (Sprint 13 M16b) Todo service FastAPI requer /healthz e /metrics (enforce por observability-endpoints-gate job separado, esta policy varre workflows por 'observability-endpoints-gate' obrigatório em ci.yml)
  # ============================================================================
  policy-gate-conftest:
    name: "Policy Gate: Conftest OPA (gates P0 + jobs pesados)"
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    continue-on-error: false   # BLOQUEANTE M10
    container:
      image: docker.io/openpolicyagent/conftest:v0.52.0
    steps:
      - uses: actions/checkout@v4

      - name: "(Policy 1/2) Listar 19 arquivos YAML alvo (Sprint 13: + load-test M11 + dependabot-auto-merge M13 + nightly-dr-backup M16 + dependabot.yml M13) e rodar conftest test 4 policies 01..04"
        run: |
          set -euo pipefail
          TARGETS="
            .github/workflows/agent-eval.yml
            .github/workflows/ci.yml
            .github/workflows/deploy-production.yml
            .github/workflows/deploy-staging.yml
            .github/workflows/deploy.yml
            .github/workflows/e2e-pr-playwright.yml
            .github/workflows/nightly-explorers-live.yml
            .github/workflows/nightly-load-test.yml
            .github/workflows/nightly-dr-backup-restore.yml
            .github/workflows/dependabot-auto-merge-security-only.yml
            .github/settings.yml
            .github/dependabot.yml
            infra/observability/compliance.rules.yml
            infra/observability/investigation.rules.yml
            infra/observability/monitoring.rules.yml
            infra/observability/platform.rules.yml
            infra/observability/report.rules.yml
            infra/observability/grafana/provisioning/dashboards/dashboard-provider.yml
            codecov.yml
          "
          ARGS=""
          MISSING=""
          for f in $TARGETS; do
            if [ -f "$f" ]; then ARGS="$ARGS $f"; else MISSING="$MISSING $f"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "⚠️  Arquivos esperados faltando (pulados: $MISSING"
          fi
          echo "🔍 Arquivos YAML válidos para policies/ 4 Rego (01..04):$ARGS"
          conftest test --output table --policy policies/ --all-namespaces $ARGS
          echo "✅ M10 Conftest policies: 4 regras, 0 violações (passou)."

      - name: "(Policy 2/2) Upload policies/ .rego fonte como artifact (evidência auditoria"
        uses: actions/upload-artifact@v4
        with:
          name: conftest-policies-${{ github.sha }}
          path: policies/*.rego
          retention-days: 60

  # ============================================================================
  # Sprint 8 M7b: secrets-guard-skeleton (BLOQUEANTE leve 10s)
  # Mitiga Risco R13: segredos hardcoded vazados em commit Python/YAML.
  # 2 passos:  (A) regex prefixos de token em TUDO;
  #           (B) grep anti RENDER_API_TOKEN = "rnd_..." hardcoded Python.
  # ============================================================================
  secrets-guard-skeleton:
    name: "Guard: Anti Hardcoded Secrets (Tokens Render/Stripe/GitHub PAT)"
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 3
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: '(A) Hardcoded Token Regex Scan — bloqueia se match prefix rnd_|sk-|ghp_|xoxb- fora de ${{ secrets.* }}'
        run: |
          set -euo pipefail
          OUT_DIR=tmp_secrets_guard
          mkdir -p "$OUT_DIR"

          echo "L1 targets tokens Python + YAML + JS/TS..." > /tmp/_sg_a.py
          echo "import subprocess, re, sys, os" >> /tmp/_sg_a.py
          echo "bad_tokens_re = re.compile(r\"(rnd_|rndr_|sk-|sk_live_|sk_test_|pk_live_|xoxb-|xoxp-|ghp_|github_pat_|glpat-)[A-Za-z0-9_\\-]{8,}\")" >> /tmp/_sg_a.py
          echo "exts = ('.py', '.yml', '.yaml', '.js', '.ts', '.tsx', '.jsx', '.env', '.ini', '.cfg', '.toml')" >> /tmp/_sg_a.py
          echo "skip_dirs = {'node_modules', '__pycache__', '.venv', 'venv', '.git', '.mypy_cache'}" >> /tmp/_sg_a.py
          echo "matches = []" >> /tmp/_sg_a.py
          echo "for root, dirs, files in os.walk('.'):" >> /tmp/_sg_a.py
          echo "    dirs[:] = [d for d in dirs if d not in skip_dirs]" >> /tmp/_sg_a.py
          echo "    for fn in files:" >> /tmp/_sg_a.py
          echo "        if not fn.endswith(exts): continue" >> /tmp/_sg_a.py
          echo "        p = os.path.join(root, fn)" >> /tmp/_sg_a.py
          echo "        try:" >> /tmp/_sg_a.py
          echo "            with open(p, 'r', errors='ignore') as f:" >> /tmp/_sg_a.py
          echo "                for ln, line in enumerate(f.readlines(), start=1):" >> /tmp/_sg_a.py
          echo "                    if '${{ secrets.' in line: continue" >> /tmp/_sg_a.py
          echo "                    mm = bad_tokens_re.search(line)" >> /tmp/_sg_a.py
          echo "                    if mm: matches.append((p, ln, mm.group(0)[:24]+'...', line.strip()[:120]))" >> /tmp/_sg_a.py
          echo "        except Exception:" >> /tmp/_sg_a.py
          echo "            pass" >> /tmp/_sg_a.py
          echo "with open('tmp_secrets_guard/token_hits.json','w') as f:" >> /tmp/_sg_a.py
          echo "    import json; json.dump(matches, f, indent=2)" >> /tmp/_sg_a.py
          echo "print(f'=== TOTAL TOKEN MATCHES = {len(matches)} ===')" >> /tmp/_sg_a.py
          echo "for m in matches: print('  SUSPECT:', m)" >> /tmp/_sg_a.py
          echo "if len(matches) > 0:" >> /tmp/_sg_a.py
          echo "    sys.exit(6)" >> /tmp/_sg_a.py
          python3 /tmp/_sg_a.py

      - name: "(B) Anti RENDER_API_TOKEN hardcoded Python (grep literal RENDER_API_TOKEN = 'rnd_...')"
        run: |
          set -euo pipefail
          set +e
          HITS_PY=$(grep -rnE "RENDER_API_TOKEN\s*=\s*[\"'][A-Za-z0-9_\\-]{6,}" apps/ packages/ tests/ 2>/dev/null)
          HITS_YML=$(grep -rnE "RENDER_API_TOKEN(_STAGING|_PROD)?\s*:\s*[\"']?[A-Za-z0-9_\\-]{10,}[\"']?" .github/ 2>/dev/null | grep -v 'secrets.' || true)
          set -e
          FOUND=0
          if [ -n "$HITS_PY" ]; then echo "❌ HARDCODED PY:"; echo "$HITS_PY"; FOUND=1; fi
          if [ -n "$HITS_YML" ]; then echo "❌ HARDCODED YML:"; echo "$HITS_YML"; FOUND=1; fi
          if [ "$FOUND" -eq 1 ]; then
             echo "Falha: RENDER_API_TOKEN ou SERVICE_ID hardcoded! Usem \${{ secrets.RENDER_API_TOKEN_STAGING }} do Environment."
             exit 7
          fi
          echo "✅ Zero hardcoded Render API tokens / Service IDs em fontes."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-guard-${{ github.sha }}
          path: tmp_secrets_guard/
          retention-days: 90
          if-no-files-found: ignore

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir mypy
          pip install --no-cache-dir -e packages/agents
          pip install --no-cache-dir fastapi uvicorn pydantic pydantic-settings "psycopg[binary]>=3.2.0" "psycopg_pool>=3.2.0" anthropic groq voyageai

      - name: Type check agents package
        run: mypy packages/agents/src/ontrackchain_agents/ --ignore-missing-imports || true
        continue-on-error: true

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build ai-service image
        run: docker build -t ontrackchain-ai-service:ci -f apps/ai-service/Dockerfile .

      - name: Verify image
        run: |
          docker run --rm ontrackchain-ai-service:ci python -c "
          import sys
          sys.path.insert(0, '/app/src')
          sys.path.insert(0, '/app/packages/agents/src')
          from ontrackchain_agents.config.agent_classes import AGENT_REGISTRY
          assert len(AGENT_REGISTRY) >= 21, f'Expected 21+ agents, got {len(AGENT_REGISTRY)}'
          print(f'✅ Image verified: {len(AGENT_REGISTRY)} agents registered')
          "

  gate-p0-01-oidc-ci:
    name: Gate P0-01 — OIDC Mock
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd apps/frontend
          npm ci

      - name: Install Playwright Chromium
        run: |
          cd apps/frontend
          npx playwright install --with-deps chromium

      - name: Run gate P0-01 (OIDC mock)
        run: make gate-p0-01-oidc-ci OIDC_CI_BASE_URL=http://localhost:8080

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-01-oidc-mock
          path: |
            tmp/gates/p0-01-oidc-mock
            apps/frontend/test-results
            apps/frontend/playwright-report

      - name: Cleanup docker compose
        if: always()
        run: |
          if [ -f "ci-artifacts/.env.oidc-ci" ]; then
            docker compose -f docker-compose.yml --env-file ci-artifacts/.env.oidc-ci down -v --remove-orphans || true
          else
            docker compose -f docker-compose.yml down -v --remove-orphans || true
          fi

  # ============================================================================
  # GATE P0-00: RLS Cross-Tenant Isolation (MANDATORY - NÃO FAZ MERGE SEM PASSAR)
  # Aplica migrations init + 0001..0021, valida tabelas, faz scan qa-gateway +
  # teste cross-tenant A vs B (se o RLS vazar = falha imediata)
  # ============================================================================
  gate-p0-00-rls:
    name: "gate-p0-00-rls: Isolamento Multi-Tenant RLS (MANDATORY)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ontrackchain
          POSTGRES_USER: ontrackchain
          POSTGRES_PASSWORD: ontrackchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Aplicar TODAS migrations (init.sql + migrations/)
        env:
          PGPASSWORD: ontrackchain
        run: |
          set -euo pipefail
          cd infra/postgres
          if [ -f init.sql ]; then
            psql -h localhost -U ontrackchain -d ontrackchain -f init.sql -q
          fi
          if [ -d migrations ]; then
            for f in $(ls migrations/*.sql | sort -V); do
              echo "  applying $(basename $f) ..."
              psql -h localhost -U ontrackchain -d ontrackchain -f "$f" -q
            done
          fi

      - name: Instalar qa-gateway + shared + deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir hatchling \
            "psycopg[binary]>=3.2" \
            "pytest>=8" \
            "pytest-asyncio>=0.23" \
            "pytest-postgresql>=6.1"
          python -m pip install --no-cache-dir ./packages/shared
          python -m pip install --no-cache-dir ./packages/qa-gateway

      - name: "P0-00a: scan RLS em todas tabelas (qa-gateway)"
        env:
          ONTRACKCHAIN_DATABASE_URL: postgresql://ontrackchain:ontrackchain@localhost:5432/ontrackchain
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          import psycopg
          from qa_gateway.rls import scan_all_rls_tables
          url = os.environ["ONTRACKCHAIN_DATABASE_URL"]
          with psycopg.connect(url) as conn:
              statuses = scan_all_rls_tables(conn)
          failed = [s for s in statuses if not s.ok]
          for s in statuses:
              mark = "PASS" if s.ok else "FAIL"
              print(f"  [{mark}] {s.table_name:40s} issues={s.issues or []}")
          print(f"\nTotal: {len(statuses)} scanned | PASS={len(statuses)-len(failed)} | FAIL={len(failed)}")
          if failed:
              sys.exit(1)
          print("✅ gate-p0-00a RLS SCAN: TODAS tabelas OK")
          PY

      - name: "P0-00b: teste cross-tenant RLS (tenant A vs B)"
        env:
          ONTRACKCHAIN_DATABASE_URL: postgresql://ontrackchain:ontrackchain@localhost:5432/ontrackchain
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys, uuid
          import psycopg

          ORG_A = str(uuid.uuid4())
          ORG_B = str(uuid.uuid4())
          URL = os.environ["ONTRACKCHAIN_DATABASE_URL"]

          with psycopg.connect(URL, autocommit=True) as conn:
              # 1. Seed organizations
              with conn.cursor() as c:
                  c.execute(
                      "INSERT INTO organizations (id, name, plan) VALUES (%s, %s, %s) ON CONFLICT DO NOTHING",
                      (ORG_A, "Test-Org-A", "enterprise"),
                  )
                  c.execute(
                      "INSERT INTO organizations (id, name, plan) VALUES (%s, %s, %s) ON CONFLICT DO NOTHING",
                      (ORG_B, "Test-Org-B", "enterprise"),
                  )

              # 2. Seed 1 user + 1 case POR ORG
              USER_A = str(uuid.uuid4()); USER_B = str(uuid.uuid4())
              CASE_A = str(uuid.uuid4()); CASE_B = str(uuid.uuid4())
              with conn.cursor() as c:
                  c.execute(
                      "INSERT INTO users (id, organization_id, email, name, role, status) VALUES "
                      "(%s, %s, 'a@a.com', 'User A', 'ADMIN', 'active') ON CONFLICT DO NOTHING",
                      (USER_A, ORG_A),
                  )
                  c.execute(
                      "INSERT INTO users (id, organization_id, email, name, role, status) VALUES "
                      "(%s, %s, 'b@b.com', 'User B', 'ADMIN', 'active') ON CONFLICT DO NOTHING",
                      (USER_B, ORG_B),
                  )
                  c.execute(
                      "INSERT INTO cases (id, organization_id, case_type, title, context_narrative, status, priority, depth) VALUES "
                      "(%s, %s, 'aml', 'Case A only', 'narrativa A', 'open', 'high', 2) ON CONFLICT DO NOTHING",
                      (CASE_A, ORG_A),
                  )
                  c.execute(
                      "INSERT INTO cases (id, organization_id, case_type, title, context_narrative, status, priority, depth) VALUES "
                      "(%s, %s, 'aml', 'Case B only', 'narrativa B', 'open', 'high', 2) ON CONFLICT DO NOTHING",
                      (CASE_B, ORG_B),
                  )

              # 3. ASSERT RLS: ORG_A só vê 1 caso e não pode ver CASE_B
              with conn.cursor() as c:
                  c.execute("SELECT set_config('app.organization_id', %s, True)", (ORG_A,))
                  c.execute("SELECT id, title FROM cases ORDER BY title")
                  rows_a = c.fetchall()
                  print(f"ORG_A cases count: {len(rows_a)}")
                  for r in rows_a:
                      print(f"  ORG_A sees: id={r[0]} title={r[1]}")

                  c.execute("SELECT set_config('app.organization_id', %s, True)", (ORG_B,))
                  c.execute("SELECT id, title FROM cases ORDER BY title")
                  rows_b = c.fetchall()
                  print(f"ORG_B cases count: {len(rows_b)}")
                  for r in rows_b:
                      print(f"  ORG_B sees: id={r[0]} title={r[1]}")

                  c.execute("SELECT set_config('app.organization_id', %s, True)", (ORG_A,))
                  c.execute("SELECT 1 FROM cases WHERE id = %s", (CASE_B,))
                  leak = c.fetchone()

          assert len(rows_a) == 1 and rows_a[0][0] == CASE_A, f"RLS LEAK users: ORG_A={rows_a}"
          assert len(rows_b) == 1 and rows_b[0][0] == CASE_B, f"RLS LEAK cases: ORG_B={rows_b}"
          assert leak is None, f"FATAL RLS LEAK: ORG_A conseguiu ler CASE_B (ID {CASE_B})"
          print("\n✅ gate-p0-00b RLS CROSS-TENANT: 0 vazamentos! Isolamento provado.")
          PY

  # ============================================================================
  # PYTEST MATRIX 7 SERVIÇOS (pytest real em TODO serviço que tem tests/)
  # ============================================================================
  pytest-matrix-services:
    name: "pytest service: ${{ matrix.service }}"
    # Sprint 7 M4: runner self-hosted primeiro; fallback ubuntu hospedado GitHub se runner offline
    # Cria label repo: "ontrackchain-ci-e2e-ubuntu-latest" ao provisionar self-hosted
    runs-on:
      - self-hosted
      - ontrackchain-ci-e2e-ubuntu-latest
      - ontrackchain
      - linux
      - x64
    timeout-minutes: 15
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: case-management, root: apps/case-management,   min_tests: 20 }
          - { service: auth-service,      root: apps/auth-service,       min_tests: 30 }
          - { service: ai-service,        root: apps/ai-service,         min_tests: 15 }
          - { service: investigation-api, root: apps/investigation-api,  min_tests: 100 }
          - { service: monitoring-api,    root: apps/monitoring-api,     min_tests: 0,  skip_missing: true }
          - { service: compliance-api,    root: apps/compliance,         min_tests: 0,  skip_missing: true }
          - { service: report-api,        root: apps/report-api,         min_tests: 0,  skip_missing: true }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Verificar pyproject.toml + tests/ (pular se não existir)"
        id: check
        shell: bash
        run: |
          PYPROJ="${{ matrix.root }}/pyproject.toml"
          TESTS="${{ matrix.root }}/tests"
          if [ ! -f "$PYPROJ" ] || [ ! -d "$TESTS" ]; then
            if [ "${{ matrix.skip_missing }}" == "true" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "⚠️ Pulando serviço ${{ matrix.service }} (sem pyproject.toml ou tests/)"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: "Instalar serviço + dev deps e rodar pytest (Sprint 9 M8 c/ cobertura coverage.xml)"
        if: steps.check.outputs.skip != 'true'
        working-directory: ${{ matrix.root }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir hatchling coverage pytest-cov
          python -m pip install --no-cache-dir ../../packages/shared || true
          python -m pip install --no-cache-dir ../../packages/agents || true
          python -m pip install --no-cache-dir ../../packages/qa-gateway || true
          python -m pip install --no-cache-dir ".[dev]"
          mkdir -p tmp_coverage tmp_tests/reports
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=xml:tmp_coverage/coverage.xml \
            --cov-report=term-missing:skip-covered \
            --junitxml=tmp_tests/reports/pytest-${{ matrix.service }}.xml
          echo "✅ pytest + coverage ${{ matrix.service }} concluído"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != 'true' && always()
        with:
          name: coverage-${{ matrix.service }}-${{ github.sha }}
          path: ${{ matrix.root }}/tmp_coverage/coverage.xml
          retention-days: 60
          if-no-files-found: ignore

  # ============================================================================
  # Sprint 9 M8: SonarCloud + CodeCov Quality Gate BLOQUEANTE (overall 80% / patch 85%)
  # ============================================================================
  sonarcloud-codecov-quality-gate:
    name: "Quality Gate: SonarCloud + CodeCov (80% overall / 85% patch)"
    needs: [pytest-matrix-services, sast-bandit-python]   # precisa coverage XML + bandit.json do SAST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: false
    permissions:
      pull-requests: read   # SonarCloud precisa ler PR para comentar
      checks: write
      contents: read
      id-token: write        # CodeCov upload OIDC (recomendado)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # SonarCloud precisa de todo histórico para blame

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Agregar coverage.xml de 4× serviços pytest (se existirem)"
        run: |
          set -euo pipefail
          mkdir -p tmp_coverage tmp_tests/reports
          python3 -c "
          import os, shutil, pathlib
          DST = pathlib.Path('tmp_coverage')
          DST.mkdir(exist_ok=True)
          ROOTS = ['apps/case-management','apps/auth-service','apps/ai-service','apps/investigation-api','packages/qa-gateway','packages/shared','packages/agents']
          for R in ROOTS:
              src = pathlib.Path(R)/'tmp_coverage'/'coverage.xml'
              if src.exists():
                  dst = DST / f'coverage-{R.replace(\"/\",\"-\")}.xml'
                  shutil.copy(src, dst)
                  print(f'copied {src} -> {dst}')
          junit_dst = pathlib.Path('tmp_tests/reports')
          for R in ROOTS:
              sd = pathlib.Path(R)/'tmp_tests'/'reports'
              if sd.exists():
                  for j in sd.glob('*.xml'):
                      d2 = junit_dst / f'{R.replace(\"/\",\"-\")}-{j.name}'
                      shutil.copy(j, d2); print(f'copied junit {d2}')
          print('agregacao concluida')
          "

      - name: "Download coverage artifacts (se matrix subiu separado; fallback local acima)"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: coverage-*-${{ github.sha }}
          merge-multiple: true
          path: tmp_coverage_artifacts/

      - name: "CodeCov upload (3 flags: python-core, frontend, ai-service) — M8"
        uses: codecov/codecov-action@v5
        continue-on-error: false
        with:
          token: ${{ secrets.CODECOV_TOKEN }}   # repo-level; se não setado CodeCov tenta OIDC public repos
          files: tmp_coverage/coverage-case-management-apps.xml,tmp_coverage/coverage-auth-service-apps.xml,tmp_coverage/coverage-investigation-api-apps.xml,tmp_coverage/coverage-ai-service-apps.xml,tmp_coverage/coverage-qa-gateway-packages.xml,tmp_coverage/coverage-shared-packages.xml,tmp_coverage/coverage-agents-packages.xml
          flags: python-core
          fail_ci_if_error: true
          verbose: true

      - name: "SonarCloud Scan + Quality Gate wait (overall 80%, 0 blocker/critical code smells) — M8"
        uses: SonarSource/sonarcloud-github-action@master
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # comentários PR
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}     # OBRIGATÓRIO: repo-level SonarCloud (Settings → Secrets)
        with:
          args: >
            -Dsonar.organization=ontrackchain
            -Dsonar.projectKey=Ontrackchain_ontrackchain
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
            -Dsonar.python.version=3.11
            -Dsonar.python.coverage.reportPaths=tmp_coverage/*.xml
            -Dsonar.python.xunit.reportPath=tmp_tests/reports/*.xml
            -Dsonar.python.bandit.reportPaths=tmp_sast/bandit.json
            -Dsonar.verbose=true

      - name: "Sonar summary artifact + link"
        run: |
          echo "SonarCloud quality gate passou. Ver relatório em: https://sonarcloud.io/dashboard?id=Ontrackchain_ontrackchain" | tee tmp_coverage/sonar_summary.txt
          if [ "${{ github.event_name }}" = "pull_request" ]; then
             echo "PR #${{ github.event.pull_request.number }}: https://sonarcloud.io/project/issues?id=Ontrackchain_ontrackchain&pullRequest=${{ github.event.pull_request.number }}" >> tmp_coverage/sonar_summary.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-codecov-${{ github.sha }}
          path: |
            tmp_coverage/
            tmp_tests/reports/
          retention-days: 60
          if-no-files-found: ignore

  # ============================================================================
  # GAP #12 (QA CI) — QA GATE OBRIGATÓRIO: qa-gateway CLI 6 comandos --help
  # ADR-018 §Workflow item 7: todo novo comando deve ser validado em CI
  # ============================================================================
  qa-gateway-cli-smoke:
    name: "QA Gate: qa-gateway 6 comandos --help (bloqueia merge)"
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Instalar qa-gateway + dependências (sem psycopg binary fallback)"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip hatchling
          python -m pip install --no-cache-dir ./packages/shared ./packages/qa-gateway click psycopg requests types-moduletype
          python -c "import qa_gateway.cli; from qa_gateway.cli import cli; print('qa-gateway import OK, comandos registados:', list(cli.commands.keys()))"

      - name: "qa-gateway 6 comandos --help — exit code 0 obrigatório"
        run: |
          set -euo pipefail
          qa-gateway --help 1>/dev/null
          qa-gateway scan-rls --help 1>/dev/null
          qa-gateway health --help 1>/dev/null
          qa-gateway scan-lgpd --help 1>/dev/null
          qa-gateway scan-sla --help 1>/dev/null
          qa-gateway scan-rbac --help 1>/dev/null
          echo "✅ 6/6 qa-gateway comandos --help OK. MVP SSOT válido."

  # ============================================================================
  # T2-02 Sprint 18 P0-08: GATE OBRIGATÓRIO SLA 24h Exploração Live (Dead Man)
  # ADR-018 §Workflows item scan-sla: SLA<24h para exploradores live.
  # 3 Modos:
  #   · STRICT = merge blocking (main / release/*)
  #   · CI_DRY_RUN = info + exit 0 (qualquer PR feature)
  #   · DATA_NA = nenhuma fonte de dado → warning + exit 0
  # ============================================================================
  qa-gateway-scan-sla-ci-p008:
    name: "QA Gate P0-08: SLA 24h Exploradores Live (scan-sla)"
    runs-on: ubuntu-latest
    needs: [qa-gateway-cli-smoke, sonarcloud-codecov-quality-gate]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # precisa de push.before / commits para timestamp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install qa-gateway + shared"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip hatchling
          python -m pip install --no-cache-dir ./packages/shared ./packages/qa-gateway click psycopg requests PyYAML

      - name: "Resolver dados de entrada para scan-sla (prom file / before timestamp / dummy)"
        id: sla_inputs
        run: |
          set -euo pipefail
          SLA_SECONDS="${{ vars.SLA_EXPLORERS_24H_SECONDS || '86400' }}"
          PROM_FILE=""
          LAST_UNIX=""
          DATA_SOURCE="none"

          # Preferência 1: artifact do nightly-explorers-live.yml (se houver último run)
          if [ -f "artifacts/explorers_live/explorers.prom" ]; then
            PROM_FILE="artifacts/explorers_live/explorers.prom"
            DATA_SOURCE="prom-file-prev-run"
          fi

          # Preferência 2: github.event.push.before (último commit push tempo = proxy último sucesso)
          if [ -z "$DATA_SOURCE" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              # Converter data do commit para Unix Epoch (UTC)
              LAST_UNIX=$(git show -s --format=%ct "$BEFORE" 2>/dev/null || echo 0)
              if [ "${LAST_UNIX:-0}" -gt 0 ]; then
                DATA_SOURCE="git.event.push.before.commit.time"
              else
                LAST_UNIX=""
              fi
            fi
          fi

          # Preferência 3: dados NA (primeiro push de repo vazio etc)
          if [ -z "$DATA_SOURCE" ]; then
            LAST_UNIX="$(date +%s)"
            DATA_SOURCE="ci-dry-run.now (dado indisponível nesta execução — INFO level)"
          fi

          # Decidir MODE por branch
          REF="${{ github.ref_name }}"
          MODE="CI_DRY_RUN"
          case "$REF" in
            main|master|release/*|hotfix/*) MODE="STRICT" ;;
          esac
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODE="CI_DRY_RUN"   # PRs: não bloquear por SLA stale (é problema do nightly, não do PR)
          fi

          echo "sla_seconds=${SLA_SECONDS}"  >> "$GITHUB_OUTPUT"
          echo "prom_file=${PROM_FILE}"       >> "$GITHUB_OUTPUT"
          echo "last_unix=${LAST_UNIX}"       >> "$GITHUB_OUTPUT"
          echo "data_source=${DATA_SOURCE}"   >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}"                 >> "$GITHUB_OUTPUT"

      - name: "Executar qa-gateway scan-sla — MODE=${{ steps.sla_inputs.outputs.mode }}"
        env:
          ONTRACKCHAIN_DATABASE_URL: ""    # CI não tem PG16 staging; usar apenas timestamps (PRs é info)
        run: |
          set -u
          MODE="${{ steps.sla_inputs.outputs.mode }}"
          SLA_SEC="${{ steps.sla_inputs.outputs.sla_seconds }}"
          PROM_FILE="${{ steps.sla_inputs.outputs.prom_file }}"
          LAST_UNIX="${{ steps.sla_inputs.outputs.last_unix }}"
          SRC="${{ steps.sla_inputs.outputs.data_source }}"

          ARGS=(--sla-seconds "$SLA_SEC" --failures-json tmp_sla/scan-sla-ci.json)
          if [ -n "$PROM_FILE" ]; then ARGS+=( --prom-file "$PROM_FILE" ); fi
          if [ -n "$LAST_UNIX" ] && [ "$LAST_UNIX" -gt 0 ] 2>/dev/null; then ARGS+=( --last-success-unix "$LAST_UNIX" ); fi

          mkdir -p tmp_sla
          echo "🔎 qa-gateway scan-sla mode=$MODE  data_source=$SRC  sla_seconds=$SLA_SEC  last_unix=$LAST_UNIX"
          set +e
          qa-gateway scan-sla "${ARGS[@]}"
          EXIT=$?
          set -e
          echo ""
          echo "=== RESUMO P0-08 SLA 24h ==="
          echo "  exit_code_scan = ${EXIT}"
          echo "  mode = ${MODE}"
          echo "  data_source = ${SRC}"

          # Decisão de quebra de CI por MODE:
          case "$MODE" in
            STRICT)
              # Em MAIN / RELEASES: bloqueia (EXIT=0 SLA ok, EXIT=1 violado, EXIT>=2 erro técnico)
              if [ "$EXIT" -ne 0 ]; then
                echo "❌ P0-08 FAIL (STRICT MODE main/release/hotfix). SLA violado ou erro técnico."
                echo "   Ação necessária: rodar workflow nightly-explorers-live.yml OU investigar monitoring-api."
                exit "$EXIT"
              fi
              echo "✅ P0-08 PASS (STRICT MODE)."
              ;;
            *)
              # CI_DRY_RUN / DATA_NA: mostra resultado mas NÃO quebra PRs (SLA não é responsabilidade do PR)
              echo "ℹ️  CI_DRY_RUN (PR/feature branch): scan-sla executado, NÃO bloqueia merge."
              echo "   Verifique nightly-explorers-live.yml para correção SLA violations reais."
              ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-gateway-scan-sla-${{ github.sha }}
          path: |
            tmp_sla/
          retention-days: 60
          if-no-files-found: ignore

  # ============================================================================
  # GAP #12 (SAST) — Static Application Security Testing: Bandit em Python apps
  # Documento 341L §4.1 item 8: WAF / Rate limit / SAST / Dependabot
  # Sprint 7 M1 (upgrade warning → bloqueio): continue-on-error = FALSE
  # ============================================================================
  sast-bandit-python:
    name: "SAST: bandit scan Python MEDIUM/HIGH (BLOQUEIA MERGE Sprint 7 M1)"
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    continue-on-error: false  # Sprint 7 M1: OBRIGATÓRIO agora (era true até Sprint 6)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install bandit"
        run: |
          python -m pip install --no-cache-dir bandit[toml]
          bandit --version

      - name: "Run bandit (severity >= MEDIUM, confidence >= MEDIUM) — bloqueia se findings > 0 (M1 Sprint 7)"
        run: |
          set -euo pipefail
          mkdir -p tmp_sast
          TARGETS="apps/case-management/src apps/auth-service/src apps/investigation-api/src apps/ai-service/src packages/qa-gateway/src packages/shared/src packages/agents/src"
          TARGETS_EXIST=""
          for T in $TARGETS; do [ -d "$T" ] && TARGETS_EXIST="$TARGETS_EXIST $T"; done
          echo "Alvos SAST existentes: [$TARGETS_EXIST]"
          # NOTA: -lll = severity MEDIUM/HIGH. -iii = confidence MEDIUM/HIGH.
          bandit -r $TARGETS_EXIST -f json -o tmp_sast/bandit.json -lll -iii || EXIT=$?
          echo "--- summary ---"
          python3 -c "
          import json, sys
          d = json.load(open('tmp_sast/bandit.json'))
          results = d.get('results',[])
          sev_count = {}
          conf_count = {}
          for r in results:
              sev_count[r['issue_severity']] = sev_count.get(r['issue_severity'],0)+1
              conf_count[r['issue_confidence']] = conf_count.get(r['issue_confidence'],0)+1
              print(f'  · sev={r[\"issue_severity\"]:6}  conf={r[\"issue_confidence\"]:6}  file={r[\"filename\"]:50}:{r[\"line_number\"]:4}  id={r[\"test_id\"]}  {r[\"test_name\"][:70]}')
          print(f'Total SAST findings (MED/HIGH): {len(results)}  ·  severidades={sev_count}  ·  confiancas={conf_count}')
          # Sprint 7 M1: falha se ANY MEDIUM/HIGH com conf >= MEDIUM (já é filter padrão -lll-iii)
          if len(results) > 0:
              sys.exit(7)
          print('✅ ZERO findings SAST. Passou no gate M1.')
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-bandit-${{ github.sha }}
          path: tmp_sast/bandit.json
          retention-days: 60
          if-no-files-found: ignore

  # ============================================================================
  # GAP #12 (DEPENDENCY AUDIT) — pip-audit vulnerabilidades CVE em dep Python
  # Sprint 7 M1 upgrade: warning → bloqueio em HIGH/CRITICAL
  # ============================================================================
  dependency-audit-pip:
    name: "Dep Audit: pip-audit CVE HIGH/CRITICAL (BLOQUEIA MERGE Sprint 7 M1)"
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    continue-on-error: false  # Sprint 7 M1: obrigatório (era true até S6)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install pip-audit"
        run: |
          python -m pip install --no-cache-dir pip-audit pip-api
          pip-audit --version

      - name: "Run pip-audit (7 roots) — bloqueia se HIGH/CRITICAL > 0 (M1 Sprint 7)"
        run: |
          set -euo pipefail
          mkdir -p tmp_audit
          ROOTS="apps/case-management apps/auth-service apps/investigation-api apps/ai-service packages/qa-gateway packages/shared packages/agents"
          TOTAL_HIGH=0
          TOTAL_CRIT=0
          for R in $ROOTS; do
            if [ ! -d "$R" ]; then continue; fi
            BASE=$(basename "$R")
            echo "--- audit $R ---"
            REQ=""
            for CAND in requirements.txt pyproject.toml setup.py; do
              [ -f "$R/$CAND" ] && { REQ="$CAND"; break; }
            done
            if [ -z "$REQ" ]; then
              echo "⚠️  Nenhum arquivo requirements/toml em $R — pulando"
              continue
            fi
            EXTRA=""
            [ "$REQ" = "requirements.txt" ] && EXTRA="-r $REQ"
            (cd "$R" && pip-audit --desc $EXTRA --format columns 2>&1 | tee ../../tmp_audit/${BASE}.txt || true) | tail -50 > /dev/null
            H=$(grep -cE "(HIGH|CRITICAL)" tmp_audit/${BASE}.txt || echo 0)
            C=$(grep -cE "CRITICAL" tmp_audit/${BASE}.txt || echo 0)
            TOTAL_HIGH=$(( TOTAL_HIGH + H ))
            TOTAL_CRIT=$(( TOTAL_CRIT + C ))
            echo "   resumo $BASE: HIGH+=${H} CRITICAL+=${C}"
          done
          echo
          echo "=== RESUMO FINAL GAP#12 M1 DEPENDENCY AUDIT ==="
          echo "  HIGH=${TOTAL_HIGH}  CRITICAL=${TOTAL_CRIT}"
          for F in tmp_audit/*.txt; do
            echo "-- $(basename $F) HIGH/CRITICAL --"
            grep -iE "(CRITICAL|HIGH|VULNERABILITY|Found)" $F 2>/dev/null | head -8 || echo "   (nenhum)"
            echo
          done
          # Sprint 7 M1: bloqueia se HIGH+CRITICAL > 0
          if [ "$(( TOTAL_HIGH + TOTAL_CRIT ))" -gt 0 ]; then
             echo "❌ GAP#12 M1 FALHOU: ${TOTAL_HIGH}H/${TOTAL_CRIT}C — corrigir deps antes de merge."
             exit 9
          fi
          echo "✅ ZERO HIGH/CRITICAL CVE. Passou no gate M1."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-${{ github.sha }}
          path: tmp_audit/
          retention-days: 60
          if-no-files-found: ignore

