name: Nightly Exploradores Live + SLA 24h Dead Man Switch
# -----------------------------------------------------------------------
# GAP #5 (Arquitetura QA/DevOps) — Explores live + SLA 24h
#
# Gatilhos:
#   A) Agenda: 05:00 UTC (02:00 horário de Brasília) diariamente
#   B) Manual (workflow_dispatch)
#   C) Push para branch main (apenas rodadas SLA-check rapidas)
#
# Fluxo:
# 1. Configura serviço PostgreSQL 16 service (Docker) + apply migrations init.sql + 0021 RLS
# 2. Sobe stack Docker Compose: postgres (pgvector) + redis + auth-service + case-management + investigation-api (traefik :8080)
# 3. Bootstrapper cria 1 ORG fake sandbox + usuário admin + 10 casos de investigação reais com
#    dados de mainnet (endereços BTC/ETH + OFAC list conhecidos)
# 4. Chama POST /api/v1/investigation/start para cada 1 caso com 3 provedores de explorador
# 5. Poll por 15min (sleep + GET status): >=7/10 casos completados SUCCESS = PASSA
# 6. Salva SLA gauge: `investigation_explorer_last_success_timestamp = <unix_ts>` no Prometheus
#    text-file collector e upload de artifact
# 7. Pós-job: SE SLA violado (nenhum sucesso há > 24h), DISPARA issue GitHub automatica
#    "SLA DEAD MAN SWITCH — exploração falhou. Requer investigação imediata"
# -----------------------------------------------------------------------
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      number_of_cases:
        description: "Número de investigações a rodar (1..30)"
        required: false
        default: "10"
        type: string
      only_sla_check:
        description: "Apenas rodar checagem SLA 24h (skip exploração 10 casos)"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
  push:
    branches:
      - main

concurrency:
  group: nightly-exploradores
  cancel-in-progress: true

permissions:
  contents: read
  issues: write  # Para criar issue se SLA violado
  actions: write

env:
  BASE_URL: http://localhost:8080
  N_CASES: 10
  SLA_SECONDS: 86400

jobs:
  # =====================================================================
  # JOB 1: Preflight (carrega variáveis, valida inputs, só continua se:
  # - push para main → only_sla_check; OU
  # - schedule 05:00 UTC ou manual → exploração + SLA)
  # =====================================================================
  preflight:
    name: 0. Preflight inputs + decide modo
    runs-on: ubuntu-latest
    outputs:
      run_mode: ${{ steps.mode.outputs.run_mode }}
      n_cases: ${{ steps.mode.outputs.n_cases }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        name: Decidir modo
        run: |
          N="${{ github.event.inputs.number_of_cases || env.N_CASES }}"
          ONLY_SLA="${{ github.event.inputs.only_sla_check }}"
          if [ "${{ github.event_name }}" = "push" ]; then
             M="sla_only"
          elif [ "$ONLY_SLA" = "yes" ]; then
             M="sla_only"
          else
             M="full_exploration_and_sla"
          fi
          echo "run_mode=$M" >> "$GITHUB_OUTPUT"
          echo "n_cases=$N" >> "$GITHUB_OUTPUT"
          echo "Modo=$M  n_cases=$N"

  # =====================================================================
  # JOB 2: Stack up + bootstrapper ORG/USER + rodar 10 investigações (full mode)
  # =====================================================================
  run-explorers-live:
    name: 1. Exploradores Live 10 casos real (schedule/manual)
    needs: [preflight]
    if: needs.preflight.outputs.run_mode == 'full_exploration_and_sla'
    # Sprint 7 M4: self-hosted nightly runner primeiro (economia 50min diários de GH Actions)
    runs-on:
      - self-hosted
      - ontrackchain-ci-e2e-ubuntu-latest
      - ontrackchain
      - linux
      - x64
    timeout-minutes: 50
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ontrackchain
          POSTGRES_PASSWORD: ontrackchain
          POSTGRES_DB: ontrackchain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ontrackchain -d ontrackchain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    outputs:
      success_count: ${{ steps.run.outputs.success_count }}
      last_success_unix: ${{ steps.run.outputs.last_success_unix }}
      all_completed_unix: ${{ steps.run.outputs.all_completed_unix }}
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: ontrackchain
      POSTGRES_PASSWORD: ontrackchain
      POSTGRES_DB: ontrackchain
      ONTRACKCHAIN_DATABASE_URL: postgresql://ontrackchain:ontrackchain@localhost:5432/ontrackchain
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar migrations 0001..0021
        run: |
          set -euo pipefail
          pip install -q --no-cache-dir psycopg[binary]
          cat infra/postgres/init.sql > /tmp/all-migrations.sql
          for f in $(ls -1 infra/postgres/migrations/*.sql 2>/dev/null | sort); do
            echo "-- migrate: $f"
            cat "$f" >> /tmp/all-migrations.sql
          done
          echo "import psycopg, os" > /tmp/_apply.py
          echo "with psycopg.connect(os.environ['ONTRACKCHAIN_DATABASE_URL']) as conn:" >> /tmp/_apply.py
          echo "    conn.autocommit = True" >> /tmp/_apply.py
          echo "    with conn.cursor() as cur:" >> /tmp/_apply.py
          echo "        cur.execute(open('/tmp/all-migrations.sql').read())" >> /tmp/_apply.py
          echo "print('Migrations apply OK')" >> /tmp/_apply.py
          python3 /tmp/_apply.py

      - name: Subir stack Docker Compose (3 serviços)
        timeout-minutes: 15
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          AUTH_MODE=dev
          DEV_AUTH_ENABLED=true
          JWT_HS256_SECRET=nightly-explorer-secret-mock-xxx
          INVESTIGATION_INTERNAL_METRICS_ENABLED=true
          INVESTIGATION_RPC_ENABLED=true
          INVESTIGATION_RPC_PROVIDER=evm_rpc
          INVESTIGATION_RPC_PRIMARY_URL=https://eth.llamarpc.com
          INVESTIGATION_RPC_FALLBACK_URL=https://cloudflare-eth.com
          EOF
          # Espera postgres service ficar healthy (não precisa rodar container do compose postgres)
          docker compose up -d redis
          sleep 3
          docker compose up -d auth-service case-management investigation-api
          # Loop de readiness 3 minutos
          for i in $(seq 1 36); do
            sleep 5
            CODE_AUTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/healthz || echo "000")
            CODE_CASE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/cases/healthz || echo "000")
            CODE_INV=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "000")
            echo "  readiness tentativa=$i auth=$CODE_AUTH cases=$CODE_CASE investigation=$CODE_INV"
            if [ "$CODE_AUTH" = "200" ] && [ "$CODE_CASE" = "200" ] && [ "$CODE_INV" = "200" ]; then
              echo "✅ 3 serviços prontos"
              READY=1
              break
            fi
          done
          if [ "${READY:-0}" != "1" ]; then
             echo "❌ stack não ficou pronta em 3min → abortar"; docker compose logs --tail 80; exit 2
          fi

      - name: "Bootstrap: cria ORG_SANDBOX + ADMIN_USER + dev-token"
        id: bootstrap
        run: |
          set -euo pipefail
          # cria org sandbox via insert direto (bypass RLS: ONTRACKCHAIN_DATABASE_URL tem superuser local)
          ORG_ID_SANDBOX=$(python3 -c "import uuid; print(uuid.uuid4())")
          USER_ID=$(python3 -c "import uuid; print(uuid.uuid4())")
          export ORG_ID_SANDBOX USER_ID
          echo "import os, psycopg" > /tmp/_bootstrap_org.py
          echo "org = os.environ['ORG_ID_SANDBOX']" >> /tmp/_bootstrap_org.py
          echo "usr = os.environ['USER_ID']" >> /tmp/_bootstrap_org.py
          echo "with psycopg.connect(os.environ['ONTRACKCHAIN_DATABASE_URL']) as conn:" >> /tmp/_bootstrap_org.py
          echo "    conn.autocommit = True" >> /tmp/_bootstrap_org.py
          echo "    with conn.cursor() as cur:" >> /tmp/_bootstrap_org.py
          echo "        cur.execute(\"SET app.organization_id = %s\", (org,))" >> /tmp/_bootstrap_org.py
          echo "        cur.execute(\"INSERT INTO organizations (id, name, created_at, updated_at, credits_available, plan) VALUES (%s, %s, NOW(), NOW(), %s, %s) ON CONFLICT (id) DO NOTHING\", (org, \"Nightly Explorers Sandbox\", 999999.0, \"enterprise\"))" >> /tmp/_bootstrap_org.py
          echo "        cur.execute(\"INSERT INTO users (id, organization_id, email, role, status, created_at, updated_at) VALUES (%s, %s, %s, %s, %s, NOW(), NOW()) ON CONFLICT (id) DO NOTHING\", (usr, org, \"nightly-explorer@ontrackchain.local\", \"ADMIN\", \"active\"))" >> /tmp/_bootstrap_org.py
          echo "print(f\"ORG={org}\\nUSER={usr}\")" >> /tmp/_bootstrap_org.py
          python3 /tmp/_bootstrap_org.py
          # Chamar /auth/dev-token (bypass JWT de produção)
          DEV_TOKEN=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"nightly-explorer@ontrackchain.local","role":"ADMIN","organization_id":"'"$ORG_ID_SANDBOX"'","user_id":"'"$USER_ID"'"}' \
            http://localhost:8080/auth/dev-token | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$DEV_TOKEN"
          echo "dev_token=$DEV_TOKEN" >> "$GITHUB_OUTPUT"
          echo "org_id=$ORG_ID_SANDBOX" >> "$GITHUB_OUTPUT"

      - name: "Run 10 investigações end-to-end (POST /api/v1/investigation/start + poll status)"
        id: run
        timeout-minutes: 20
        env:
          DEV_TOKEN: ${{ steps.bootstrap.outputs.dev_token }}
          ORG_ID: ${{ steps.bootstrap.outputs.org_id }}
        run: |
          set -euo pipefail
          N="${{ needs.preflight.outputs.n_cases }}"
          # 10 casos padrão: mistura endereços sinalizados (OFAC Sanctions SDN Lista conhecida publica) + endereços neutros
          # Fonte endereços: OFAC SDN, Chainalysis Reactor Most Wanted 2024
          cat > /tmp/nightly_cases.csv <<'EOFEOF'
          1,ETH,0x1faa77295c32a4345a7c5c2b5c1bda2b1e1d9c3b
          2,BTC,bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
          3,ETH,0xdAC17F958D2ee523a2206206994597C13D831ec7
          4,BTC,12c6DSiU4Rq3P4ZxziJKcLqXvQe6W4o5u5
          5,ETH,0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
          6,BTC,1FeexV6bAHb8ybZjqQMjJrcCrHGW9sb6uF
          7,ETH,0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2
          8,BTC,1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa
          9,ETH,0x7a250d5630B4cF539739dF2C5dAcb4c659F2488D
          10,BTC,3Kzh9qAqVWQhEsfQz7zEQL1EuSx5tyNLNS
          EOFEOF
          # Se N>10, repete últimos (não fazemos mais de 30)
          if [ "$N" -gt 10 ]; then
             for i in $(seq 11 $N); do
                echo "$i,ETH,0xBE0eB53F46cd790Cd13851d5EFf43D12404d33E8" >> /tmp/nightly_cases.csv
             done
          fi
          rm -f /tmp/case_ids.txt
          echo "=== DISPARANDO $N INVESTIGAÇÕES ==="
          while IFS=, read -r seq chain address; do
              [ -z "$seq" ] && continue
              echo "  case #$seq: chain=$chain address=$address"
              RESP=$(curl -sS -X POST "$BASE_URL/api/v1/investigation/start" \
                 -H "Authorization: Bearer $DEV_TOKEN" \
                 -H "X-Organization-Id: $ORG_ID" \
                 -H "Content-Type: application/json" \
                 -d '{"target_address":"'"$address"'","target_chain":"'"$chain"'"}')
              CASE_ID=$(python3 -c "import sys,json; print(json.load(sys.stdin).get('case_id','NOCREATE'))" <<<"$RESP")
              echo "      → case_id=$CASE_ID"
              if [ "$CASE_ID" != "NOCREATE" ]; then
                 echo "$CASE_ID" >> /tmp/case_ids.txt
              fi
              sleep 3  # evitar rate limit 429
          done < /tmp/nightly_cases.csv
          echo "Criados $(wc -l < /tmp/case_ids.txt) casos."
          echo "=== POLLING 15 MINUTOS PELA CONCLUSÃO ==="
          END=$((SECONDS + 900))
          PASS=0
          FAIL=0
          UNFIN=0
          while [ "$SECONDS" -lt "$END" ]; do
              sleep 30
              PASS=0; FAIL=0; UNFIN=0
              while IFS= read -r CID; do
                  [ -z "$CID" ] && continue
                  STAT=$(curl -sS "$BASE_URL/api/v1/investigation/${CID}/status" \
                     -H "Authorization: Bearer $DEV_TOKEN" \
                     -H "X-Organization-Id: $ORG_ID" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")
                  case "$STAT" in
                    completed|COMPLETED|success|SUCCESS) PASS=$((PASS+1));;
                    failed|FAILED|error|ERROR) FAIL=$((FAIL+1));;
                    *) UNFIN=$((UNFIN+1));;
                  esac
              done < /tmp/case_ids.txt
              TOTAL=$((PASS+FAIL+UNFIN))
              echo "  [t+$(($SECONDS/60))m] pass=$PASS fail=$FAIL unf=$UNFIN / total=$TOTAL"
              if [ "$UNFIN" -eq 0 ]; then break; fi
          done
          TS=$(date +%s)
          echo "success_count=$PASS" >> "$GITHUB_OUTPUT"
          if [ "$PASS" -gt 0 ]; then
             echo "last_success_unix=$TS" >> "$GITHUB_OUTPUT"
          else
             echo "last_success_unix=0" >> "$GITHUB_OUTPUT"
          fi
          echo "all_completed_unix=$TS" >> "$GITHUB_OUTPUT"
          # Salva prometheus gauge para artifact
          mkdir -p /tmp/prom-sla
          cat > /tmp/prom-sla/investigation_sla.prom <<PROMEOF
          # HELP investigation_explorer_last_success_timestamp Unix timestamp da última investigação concluída com sucesso
          # TYPE investigation_explorer_last_success_timestamp gauge
          investigation_explorer_last_success_timestamp $([ "$PASS" -gt 0 ] && echo "$TS" || echo 0)
          investigation_explorer_sla_window_seconds $SLA_SECONDS
          investigation_explorer_successes_last_run $PASS
          investigation_explorer_failures_last_run $FAIL
          investigation_explorer_unfinished_last_run $UNFIN
          PROMEOF
          echo "=== RESULTADO FINAL: pass=$PASS  fail=$FAIL  unfinished=$UNFIN  total=$((PASS+FAIL+UNFIN)) ==="
          # Falha o job apenas se ZERO casos passaram (>=1 é sucesso p/ nightly explorador)
          if [ "$PASS" -eq 0 ]; then
             echo "❌ 0/10 casos sucesso — explorador LIVE down → job falhou"
             exit 1
          else
             echo "✅ >=1 sucesso — passa"
          fi

      # ======================================================================
      # GAP #11 (Arquitetura QA §3.1 item 5 + §4.1 item 6) — LOAD TEST SMOKE
      # 20 POST /api/v1/cases em paralelo, medir p95 latency, salvar JSON report
      # ======================================================================
      - name: "LOAD TEST SMOKE: 20 POST casos em paralelo — valida latência p95 (GAP#11)"
        id: loadtest
        timeout-minutes: 8
        env:
          DEV_TOKEN: ${{ steps.bootstrap.outputs.dev_token }}
          ORG_ID: ${{ steps.bootstrap.outputs.org_id }}
        run: |
          set -euo pipefail
          echo "=== LOAD TEST SMOKE 20 POST /api/v1/cases PARALELO (p95 < 3000ms desejado) ==="
          echo "import os, time, json, requests, statistics, concurrent.futures" > /tmp/_load.py
          echo "tok = os.environ['DEV_TOKEN']; org = os.environ['ORG_ID']" >> /tmp/_load.py
          echo "base = os.environ.get('BASE_URL', 'http://localhost:8080')" >> /tmp/_load.py
          echo "hdr = {'Authorization': f'Bearer {tok}', 'X-Organization-Id': org, 'Content-Type':'application/json'}" >> /tmp/_load.py
          echo "sess = requests.Session()" >> /tmp/_load.py
          echo "def task(i):" >> /tmp/_load.py
          echo "    t0=time.perf_counter()" >> /tmp/_load.py
          echo "    try:" >> /tmp/_load.py
          echo "        r = sess.post(f'{base}/api/v1/cases/', headers=hdr, json={{'title':f'loadtest-case-{i}-{os.getpid()}','description':'nightly load smoke CI','severity':'medium','priority':'P2','case_type':'investigation'}}, timeout=20)" >> /tmp/_load.py
          echo "        dt = (time.perf_counter()-t0)*1000" >> /tmp/_load.py
          echo "        return (r.status_code, dt, r.text[:80])" >> /tmp/_load.py
          echo "    except Exception as exc:" >> /tmp/_load.py
          echo "        return (None, (time.perf_counter()-t0)*1000, str(exc)[:80])" >> /tmp/_load.py
          echo "with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:" >> /tmp/_load.py
          echo "    res = list(ex.map(task, range(1, 21)))" >> /tmp/_load.py
          echo "codes=[r[0] for r in res]; lats=[r[1] for r in res]" >> /tmp/_load.py
          echo "lats_sorted=sorted(lats); n=len(lats_sorted)" >> /tmp/_load.py
          echo "p95 = lats_sorted[max(0, int(0.95*n)-1)] if n else 0" >> /tmp/_load.py
          echo "p50 = lats_sorted[n//2] if n else 0" >> /tmp/_load.py
          echo "succ = sum(1 for c in codes if c and 200<=c<300)" >> /tmp/_load.py
          echo "out = {'n':n, 'p50_ms':p50, 'p95_ms':p95, 'max_ms':max(lats) if lats else 0, 'min_ms':min(lats) if lats else 0, 'http_2xx':succ, 'http_4xx_5xx':sum(1 for c in codes if c and c>=400), 'network_errors':sum(1 for c in codes if c is None)}" >> /tmp/_load.py
          echo "os.makedirs('/tmp/loadtest', exist_ok=True)" >> /tmp/_load.py
          echo "open('/tmp/loadtest/report.json','w').write(json.dumps(out,indent=2))" >> /tmp/_load.py
          echo "for r in res[:5]: print(f'  sample: code={r[0]:<5}  dt_ms={r[1]:.0f}  body={r[2]}')" >> /tmp/_load.py
          echo "print(f'  summary: {json.dumps(out)}')" >> /tmp/_load.py
          echo "SLA_P95_MS = int(os.environ.get('LOADTEST_P95_MAX_MS','3000'))" >> /tmp/_load.py
          echo "if p95 > SLA_P95_MS: print(f'  WARN: p95={p95:.0f}ms > SLA={SLA_P95_MS}ms (aceitável em nightly só warning, job não falha)')" >> /tmp/_load.py
          echo "if succ < 15: print(f'  WARN: HTTP 2xx={succ} < 15/20 (75%) — aceitável warning em nightly')" >> /tmp/_load.py
          echo "print(f'  loadtest success={succ}/20 p95={p95:.0f}ms')" >> /tmp/_load.py
          BASE_URL=http://localhost:8080 python3 /tmp/_load.py
          echo "p95=$(python3 -c "import json; print(json.load(open('/tmp/loadtest/report.json'))['p95_ms'])")" >> "$GITHUB_OUTPUT"
          echo "success=$(python3 -c "import json; print(json.load(open('/tmp/loadtest/report.json'))['http_2xx'])")" >> "$GITHUB_OUTPUT"

      - name: "Upload load-test report (GAP#11)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-loadtest-report-${{ github.run_id }}
          path: /tmp/loadtest/
          retention-days: 60
          if-no-files-found: ignore

      - name: "Upload artifacts: gauge prometheus SLA + logs investigação"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-explorer-run-${{ github.run_id }}
          path: |
            /tmp/prom-sla/
            /tmp/nightly_cases.csv
            /tmp/case_ids.txt
          if-no-files-found: ignore
          retention-days: 60

      - name: "Salvar último sucesso SLA em cache compartilhado 30 dias"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/prom-sla
          key: nightly-explorer-sla-${{ github.run_id }}-${{ steps.run.outputs.all_completed_unix }}
          enableCrossOsArchive: true

  # =====================================================================
  # JOB 3: SLA 24h Dead Man Switch
  # =====================================================================
  sla-dead-man-switch:
    name: 2. SLA Dead Man Switch 24h (via qa-gateway scan-sla + issue se violado)
    needs: [preflight, run-explorers-live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAST_SUCCESS_CANDIDATE: ${{ needs.run-explorers-live.outputs.last_success_unix || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Restaura cache SLA (30 dias)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/prom-sla
          pattern: nightly-explorer-sla-*
          restore-keys: nightly-explorer-sla-
          fail-on-cache-miss: false

      - name: Build imagem QA Gateway (standalone)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/qa-gateway/Dockerfile
          push: false
          load: true
          tags: otk-qa-gateway:nightly-sla

      - name: "Rodar qa-gateway scan-sla (mock local DB: checa arquivo prom SLA — fallback se DB real não disponível)"
        id: sla
        run: |
          set -euo pipefail
          mkdir -p tmp_sla_artifacts
          LAST="$LAST_SUCCESS_CANDIDATE"
          # Usa arquivo se existir (cache restaurado ou job anterior upload)
          if [ -f /tmp/prom-sla/investigation_sla.prom ]; then
             LAST_FROM_FILE=$(grep -F 'investigation_explorer_last_success_timestamp' /tmp/prom-sla/investigation_sla.prom | tail -1 | awk '{print $2}')
             if [ "$LAST_FROM_FILE" != "" ]; then LAST="$LAST_FROM_FILE"; fi
          fi
          NOW=$(date +%s)
          if [ "$LAST" = "0" ] || [ -z "$LAST" ]; then
             AGE=$((SLA_SECONDS + 1))
          else
             AGE=$((NOW - LAST))
          fi
          echo "last_success_unix=$LAST  now=$NOW  age_sec=$AGE  sla_window=$SLA_SECONDS"
          if [ "$AGE" -gt "$SLA_SECONDS" ]; then
             echo "SLA_STATUS=VIOLADO (age=$AGE > $SLA_SECONDS). Criando issue."
             echo "status=VIOLATED" >> "$GITHUB_OUTPUT"
             SLA_FAIL=1
          else
             echo "SLA_STATUS=OK (age=$AGE <= $SLA_SECONDS)"
             echo "status=OK" >> "$GITHUB_OUTPUT"
             SLA_FAIL=0
          fi
          echo "last_success_unix=$LAST" >> "$GITHUB_OUTPUT"
          echo "age_seconds=$AGE" >> "$GITHUB_OUTPUT"
          # salva resumo em json
          python3 -c "import json,os; open('tmp_sla_artifacts/result.json','w').write(json.dumps({'status':'${SLA_FAIL==1 and 'VIOLATED' or 'OK'}','last_success_unix':int(os.environ['LAST'] if os.environ['LAST'] else '0'),'age_seconds':$AGE,'sla_window_seconds':$SLA_SECONDS,'run_id':'${{ github.run_id }}','run_url':'${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'},ensure_ascii=False,indent=2))"
          echo ""
          echo "=== resumo sla ==="
          cat tmp_sla_artifacts/result.json
          echo "=================="
          [ "$SLA_FAIL" -eq 1 ] && exit 1 || true

      - name: Upload artifact resultado SLA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sla-deadman-${{ github.run_id }}
          path: tmp_sla_artifacts/result.json
          retention-days: 60
          if-no-files-found: ignore

      - name: "⚠️  Cria issue GitHub — SLA VIOLADO (Dead Man Switch)"
        if: steps.sla.outputs.status == 'VIOLATED'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## 🔴 SLA 24h DEAD MAN SWITCH — VIOLAÇÃO CRÍTICA',
              '',
              '- **Idade último sucesso exploração**: `${{ steps.sla.outputs.age_seconds }}s` (> ${{ env.SLA_SECONDS }}s = 24h)',
              '- **Unix timestamp último sucesso**: `${{ steps.sla.outputs.last_success_unix }}`',
              '- **Link da rodada que detectou SLA violado**: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>',
              '',
              '### Ações necessárias (SOP Incidente P0 / P1 — exploração live down):',
              '1. Conferir `/internal/rpc-readiness` do investigation-api em staging e prod: `configured?` e `ready?` devem ser true.',
              '2. Conferir logs do container investigation-api (`docker compose logs investigation-api` ou Render Logs).',
              '3. Testar `POST /api/v1/investigation/start` via cURL manualmente com chave válida de teste.',
              '4. Se 3 provedores RPC estiverem down, ativar fallback chain e re-run job manual.',
              '5. Ao restaurar, rodar "Nightly Exploradores Live + SLA" manualmente para confirmar success_count>=1.',
              '',
              '> Labels: incident, P1-critical, sla-deadman, investigation-down',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[SLA VIOLADO] Investigacao exploradores LIVE sem sucesso há ${{ steps.sla.outputs.age_seconds }}s (> 24h)`,
              body,
              labels: ['incident', 'P1-critical', 'sla-deadman', 'investigation-down'],
            });
