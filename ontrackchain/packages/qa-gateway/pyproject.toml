[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "ontrackchain-qa-gateway"
version = "0.1.0"
description = "OnTrackChain QA Gateway HUB - Single Source of Truth for RLS, LGPD, Health Checks"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.7.4",
  "requests>=2.32.3",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.8",
  "pytest-postgresql>=6.1.1",
]

[project.scripts]
qa-gateway = "qa_gateway.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
