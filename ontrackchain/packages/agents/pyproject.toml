[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "ontrackchain-agents"
version = "0.2.0"
requires-python = ">=3.11"
description = "Agent Framework v4.0 — Three-class architecture (A/B/C) for OnTrackChain compliance"
dependencies = [
  "pydantic>=2.7.4",
  "httpx>=0.27.0",
  "celery>=5.4.0",
]

[project.optional-dependencies]
llm = [
  "anthropic>=0.40.0",
  "groq>=0.12.0",
]
rag = [
  "pgvector>=0.3.0",
  "voyageai>=0.3.0",
]
all = [
  "anthropic>=0.40.0",
  "groq>=0.12.0",
  "pgvector>=0.3.0",
  "voyageai>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ontrackchain_agents"]
