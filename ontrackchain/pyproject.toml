[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "ontrackchain-platform"
version = "3.1.0"
description = "Ontrackchain Platform Workspace Root (Sprint 18)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Ontrackchain" },
]
dependencies = [
  "ontrackchain-shared @ file:///${PROJECT_ROOT}/packages/shared",
  "ontrackchain-qa-gateway @ file:///${PROJECT_ROOT}/packages/qa-gateway",
  "ontrackchain-agents @ file:///${PROJECT_ROOT}/packages/agents",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.8",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-requests",
  "types-PyYAML",
]

[tool.hatch.envs.default]
dependencies = [
  "ontrackchain-shared[dev] @ file:///${PROJECT_ROOT}/packages/shared",
  "ontrackchain-qa-gateway[dev] @ file:///${PROJECT_ROOT}/packages/qa-gateway",
  "ontrackchain-agents @ file:///${PROJECT_ROOT}/packages/agents",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.8",
  "httpx>=0.27.0",
]
[tool.hatch.envs.default.extra-dirs]
"/app/src" = [
  "apps/auth-service/src",
  "apps/compliance-api/src",
  "apps/case-management/src",
  "apps/investigation-api/src",
  "apps/monitoring-api/src",
  "apps/public-api/src",
  "apps/report-api/src",
  "apps/ai-service/src",
  "apps/mock-oidc/src",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "tests",
  "apps/auth-service/tests",
  "apps/compliance-api/tests",
  "apps/case-management/tests",
  "apps/investigation-api/tests",
  "apps/monitoring-api/tests",
  "apps/public-api/tests",
  "apps/report-api/tests",
  "apps/ai-service/tests",
  "apps/mock-oidc/tests",
  "packages/shared/tests",
  "packages/qa-gateway/tests",
  "packages/agents/tests",
]
asyncio_mode = "auto"
pythonpath = [
  ".",
  "packages/shared/src",
  "packages/qa-gateway/src",
  "packages/agents/src",
  "apps/auth-service/src",
  "apps/compliance-api/src",
  "apps/case-management/src",
  "apps/investigation-api/src",
  "apps/monitoring-api/src",
  "apps/public-api/src",
  "apps/report-api/src",
  "apps/ai-service/src",
  "apps/mock-oidc/src",
  "apps/auth-service/tests",
  "apps/investigation-api/tests",
  "apps/case-management/tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"
lint.select = ["E", "F", "I", "N", "B", "UP", "W"]
lint.ignore = ["E501", "B008"]
lint.isort.known-first-party = [
  "ontrackchain_shared",
  "qa_gateway",
  "ontrackchain_agents",
  "auth_service",
  "compliance_api",
  "case_management",
  "investigation_api",
  "monitoring_api",
  "public_api",
  "report_api",
  "ai_service",
  "mock_oidc",
]

# ============================================================
# Sprint S28+28: [tool.mypy] SSOT workspace (8 apps + 3 packages)
# S28+31→S28+45: Roadmap incremental strict 1 app/sprint (10 milestones 10/10 ✅)
# S28+46 P4: ATIVAÇÃO STRICT GLOBAL DEFAULT — fecha o ciclo do incrementalismo.
#   · Qualquer NOVO módulo criado a partir de hoje JÁ NASCE em strict automaticamente (fail-fast).
#   · Os 12 overrides [[tool.mypy.overrides]] individuais PERMANECEM (redundância segura = defesa em profundidade).
#   · 9 flags idênticas em todos os níveis (default + overrides) garantem comportamento determinístico.
# ============================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
warn_redundant_casts = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
show_error_context = true
pretty = true
mypy_path = [
    "packages/shared/src",
    "packages/qa-gateway/src",
    "packages/agents/src",
    "apps/ai-service/src",
    "apps/auth-service/src",
    "apps/case-management/src",
    "apps/compliance-api/src",
    "apps/investigation-api/src",
    "apps/monitoring-api/src",
    "apps/public-api/src",
    "apps/report-api/src",
    "apps/mock-oidc/src",
]
exclude = [
    "apps/frontend",
    "packages/.*/tests",
    "apps/.*/tests",
    "tests",
    "__pycache__",
]
incremental = true
cache_dir = ".mypy_cache"

# ============================================================
# Sprint S28+31 P3: Strict mypy Incremental — Shared First
# S28+31→S28+45: 10 milestones 1 app/sprint (overrides individuais)
# S28+46 P4: ATIVAÇÃO STRICT GLOBAL DEFAULT [tool.mypy] (9 flags estritas)
#   · default agora = 9 flags strict; overrides individuais permanecem (redundância)
#   · NOVOS módulos sem override específico JÁ NASÇEM strict (fail-fast positivo)
# S28+32 P3: qa_gateway.* strict
# S28+33 P3: ontrackchain_agents.* strict (2629 LOC, 19 arquivos: sanctions_engine + evidence_trail + etc)
# S28+37 P3: auth_service.* strict (PRIMEIRO APP: 2737 LOC, main.py 2473L FastAPI auth)
# Roadmap ADR mypy incremental strict Shared → QA → Agents → 9 Apps 1×1 → Global Default:
#   · S28+31 ✅ packages/shared/src       (SSOT fonte da verdade)
#   · S28+32 ✅ packages/qa-gateway/src   (9 comandos CLI + policies + rls guard)
#   · S28+33 ✅ packages/agents/src       (2629 LOC: sanctions/evidence/preventive_block/travel_rule)
#   · S28+37 ✅ apps/auth-service         (PRIMEIRO APP: OIDC, 2FA, B2B HMAC, secrets_loader)
#   · S28+38 ✅ apps/compliance-api       (segundo APP: 6420 LOC, structural_screens + risk_provider 28 arquivos)
#   · S28+39 ✅ apps/case-management      (terceiro APP: 1353 LOC FastAPI CRUD casos)
#   · S28+40 ✅ apps/investigation-api    (quarto APP: 8485 LOC main 5968L + billing/stripe/worker/ai/graph intel 12 arquivos)
#   · S28+41 ✅ apps/monitoring-api     (quinto APP: 2699 LOC main.py FastAPI SLO + healthz endpoints)
#   · S28+42 ✅ apps/public-api         (sexto APP: 886 LOC main.py FastAPI endpoints público sem RBAC)
#   · S28+43 ✅ apps/report-api         (sétimo APP: 2737 LOC main.py FastAPI relatórios PDF/dashboards)
#   · S28+44 ✅ apps/ai-service         (oitavo APP: 3710 LOC main 2590L + agent_framework LLM 854L + worker 265L, ÚLTIMO APP REAL)
#   · S28+45 ✅ apps/mock-oidc         (nono APP ÚLTIMO: 696 LOC main.py mock OIDC, 🏁 ROADMAP 10 MÓDULOS 10/10 ✅! 12 MÓDULOS STRICT: 3 shared + 9 apps)
#   · S28+46 ✅ DEFAULT [tool.mypy]    (🏁 FECHAMENTO CICLO STRICT GLOBAL! 9 flags estritas no bloco default. Novos módulos nascem strict automaticamente. 12 overrides permanecem = defesa em profundidade)
# Docs: ADR mypy incremental strict Shared → QA → Agents → 9 Apps 1×1 → Global Default Strict.
# ============================================================
