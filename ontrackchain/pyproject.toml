#   · S28+50 ✅ Docker Otimizado       (11 Dockerfiles Python: non-root UID/GID 10001 appuser + PYTHONDONTWRITEBYTECODE=PYTHONUNBUFFERED=1 + HEALTHCHECK urllib /healthz zero deps + camadas COPY ordenadas (shared → agents → pyproject → src) + remoção extras [dev] runtime em auth/case/investigation/ai + rm /tmp/ontrackchain-* após pip + PID 1 python via CMD sh exec + docker-compose.yml corrige 4/4 build.context (context: . + dockerfile: apps/X) em auth/public/case/mock)
#   · S28+51 ✅ Makefile Compose Conv  (5 novos targets NÃO-gating: scan-secrets-strict (alias trufflehog curto), e2e-light (wrapper s28p27-run-e2e-light.sh perfil LEVE), compose-up-full (21 services stack completa observabilidade+9apps+3workers), compose-health (ps tabela formatada health), compose-purge (down -v destrutivo COM FORCE_PURGE=1 obrigatório, fail-safe default) + 5 linhas help + .PHONY atualizado)
#   · S28+52 ✅ Compose DependsOn HC   (13 relações service_started → service_healthy: CAT A 8 relações dict (redis HC compose + 4 apps HC Dockerfile investigation/compliance/monitoring/ai + case depende de ai) + CAT B 5 relações estilo LIST → DICT (prometheus depende de 4 apps + alertmanager, grafana depende prometheus). Resultado: 15 service_healthy / 10 service_completed_successfully / 2 service_started (alertmanager/grafana 3rd-party sem HC). Eliminado race conditions e2e-light.)
