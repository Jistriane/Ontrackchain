#   · S28+47 ✅ SonarCloud Quality     (Sincronia paths sonar-project.properties RAIZ ↔ ci.yml args + ROOTS coverage 7→13 serviços + CodeCov wildcard + Bandit SARIF → GH Code Scanning + arquivo subpasta marcado OBSOLETO)
