version: "1"
# Auto-gen hash-forced update - backtick 0 removed
previews:
  generation: false
services:
- type: keyvalue
  name: ontrackchain-redis-staging
  plan: free
  maxmemoryPolicy: allkeys-lru
  ipAllowList: []
- type: pserv
