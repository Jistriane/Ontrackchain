# =============================================================================
# Ontrackchain — Render Blueprint (FULL STACK, não-showcase)
# Single Source of Truth: 20 serviços + ordem topológica + resources Free Tier
# Uso: Render → Blueprints → Connect Repo → Path: render.yaml
# =============================================================================
# Owner ID (Team): tea-d0mesj63jp1c738a1qbg
# Environment Group (secrets): ontrackchain-staging-secrets (43 chaves, sync:false)
# Ordem deploy (topológica): Postgres → Redis → Keycloak → Auth → APIs → Workers → Observability → Gateway → Frontend
# =============================================================================
# Alteração crítica: dockerContext = ontrackchain (raiz do monorepo) para TODOS
# serviços Python/TS pois Dockerfiles copiam ../../packages/shared e infra/*
# =============================================================================

services:
  # =========================================================================
  # LAYER 1 — INFRAESTRUTURA PERSISTENTE (deploy primeiro, autoDeploy: no)
  # =========================================================================

  - type: pserv
    name: ontrackchain-psql-pgvector-staging
    runtime: image
    image:
      ownerId: tea-d0mesj63jp1c738a1qbg
      url: docker.io/pgvector/pgvector:pg16
    autoDeploy: no
    disk:
      name: pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 15
    envVars:
      - key: POSTGRES_DB
        value: ontrackchain_staging
      - key: POSTGRES_USER
        value: ontrackchain
      - key: POSTGRES_PASSWORD
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: POSTGRES_PASSWORD
        sync: false
      - key: AUTH_DB_NAME
        value: auth_service
      - key: INVESTIGATION_DB_NAME
        value: investigation_service
      - key: COMPLIANCE_DB_NAME
        value: compliance_service
      - key: MONITORING_DB_NAME
        value: monitoring_service
      - key: REPORT_DB_NAME
        value: report_service
      - key: CASE_DB_NAME
        value: case_management
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata
    region: oregon
    plan: standard_256

  - type: redis
    name: ontrackchain-valkey-staging
    plan: starter
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: Public (staging only)
    highAvailability: enabled

  # =========================================================================
  # LAYER 2 — IDP / AUTENTICAÇÃO CENTRAL
  # =========================================================================

  - type: web
    name: ontrackchain-keycloak-staging
    runtime: image
    image:
      ownerId: tea-d0mesj63jp1c738a1qbg
      dockerContext: ontrackchain
      dockerfilePath: ontrackchain/infra/render/keycloak/Dockerfile
    autoDeploy: no
    envVars:
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_PROXY
        value: edge
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL_HOST
        fromService:
          name: ontrackchain-psql-pgvector-staging
          type: pserv
          property: host
      - key: KC_DB_URL_PORT
        fromService:
          name: ontrackchain-psql-pgvector-staging
          type: pserv
          property: port
      - key: KC_DB_URL_DATABASE
        value: ontrackchain_staging
      - key: KC_DB_USERNAME
        value: ontrackchain
      - key: KC_DB_PASSWORD
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: POSTGRES_PASSWORD
        sync: false
      - key: KEYCLOAK_ADMIN
        value: admin
      - key: KEYCLOAK_ADMIN_PASSWORD
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: KEYCLOAK_ADMIN_PASSWORD
        sync: false
      - key: KC_HEALTH_ENABLED
        value: "true"
      - key: KC_METRICS_ENABLED
        value: "true"
      - key: KEYCLOAK_FRONTEND_URL
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: KEYCLOAK_FRONTEND_URL
      - key: KEYCLOAK_REALM
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: KEYCLOAK_REALM
      - key: KEYCLOAK_CLIENT_ID
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: KEYCLOAK_CLIENT_ID
      - key: KEYCLOAK_CLIENT_SECRET
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: KEYCLOAK_CLIENT_SECRET
        sync: false
      - key: DEFAULT_USER_EMAIL
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: DEFAULT_USER_EMAIL
      - key: DEFAULT_USER_PASSWORD
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: DEFAULT_USER_PASSWORD
        sync: false
    healthCheckPath: /health/ready
    region: oregon
    plan: standard_256
    memoryLimitMB: 512
    cpuLimitMhz: 2000
    numInstances: 1

  # =========================================================================
  # LAYER 3 — AUTH CORE (valida credenciais, emite JWTs, cria schemas)
  # =========================================================================

  - type: web
    name: ontrackchain-auth-staging
    runtime: image
    image:
      ownerId: tea-d0mesj63jp1c738a1qbg
      dockerContext: ontrackchain
      dockerfilePath: ontrackchain/apps/auth-service/Dockerfile
    autoDeploy: yes
    buildFilter:
      paths:
        - ontrackchain/apps/auth-service/**/*.py
        - ontrackchain/packages/shared/**/*.py
        - ontrackchain/infra/postgres/**/*.sql
        - ontrackchain/infra/render/scripts/**
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: staging
      - key: AUTH_MODE
        value: keycloak
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: DATABASE__URL
        fromService:
          name: ontrackchain-psql-pgvector-staging
          type: pserv
          property: connectionString
        serviceDatabase: auth_service
      - key: REDIS__URL
        fromService:
          type: redis
          name: ontrackchain-valkey-staging
          property: connectionString
      - key: KEYCLOAK_URL
        fromService:
          type: web
          name: ontrackchain-keycloak-staging
          property: host
      - key: KEYCLOAK_REALM
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: KEYCLOAK_REALM
      - key: KEYCLOAK_CLIENT_ID
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: KEYCLOAK_CLIENT_ID
      - key: KEYCLOAK_CLIENT_SECRET
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: KEYCLOAK_CLIENT_SECRET
        sync: false
      - key: KEYCLOAK_ADMIN_USER
        value: admin
      - key: KEYCLOAK_ADMIN_PASSWORD
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: KEYCLOAK_ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: DEFAULT_USER_EMAIL
      - key: DEFAULT_ADMIN_PASSWORD
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: DEFAULT_USER_PASSWORD
        sync: false
      - key: JWT_ISSUER
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: JWT_ISSUER
      - key: JWT_AUDIENCE
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: JWT_AUDIENCE
      - key: JWT_HS256_SECRET
        fromEnvGroup: ontrackchain-staging-secrets
        envVarKey: JWT_HS256_SECRET
        sync: false
    healthCheckPath: /healthz
    region: oregon
    plan: standard_256
    memoryLimitMB: 512
    cpuLimitMhz: 2000
    numInstances: 1

