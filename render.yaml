  runtime: docker
  dockerContext: ontrackchain
  dockerfilePath: infra/render/postgres-pgvector/Dockerfile
  memoryLimitMB: 512
  cpuLimitMhz: 2000
  autoDeploy: false
  disk:
    name: pgvector-data
    mountPath: /var/lib/postgresql/data
    sizeGB: 15
  envVars:
  - key: POSTGRES_USER
    value: postgres
  - key: POSTGRES_PASSWORD
    sync: false
  - key: POSTGRES_DB
    value: ontrackchain
  - key: PGDATA
