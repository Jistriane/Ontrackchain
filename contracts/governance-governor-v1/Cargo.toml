[package]
name = "governance-governor-v1"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Governança baseada em SBT Badge (G5=2: peso por badge, não por token novo). Propose → Vote (support 0 against 1 for 2 abstain) → Queue → Execute. Quorum mínimo 5% e duração padrão 3 dias."
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = []

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
