# ============================================================
# SonarCloud Project Properties — Ontrackchain Monorepo
# Sprint S28+26 P2: integração básica com job ci.yml SonarCloud Gate
# Sprint S28+47 P4: SINCRONIA ESTRITA com ci.yml args L733-L743 (paths 100% idênticos)
#   Qualquer alteração de paths AQUI deve ser replicada em CI.yml e vice-versa (redundância SSOT).
# Provedor: SonarCloud (sonarcloud.io). Organização: ontrackchain (exemplo)
# Ativar em: GitHub Secrets → SONAR_TOKEN (gerar em sonarcloud.io account)
# ============================================================

# --- Identidade do projeto (substitua pelos valores REAIS do SonarCloud) ---
sonar.organization=ontrackchain
sonar.projectKey=ontrackchain_ontrackchain
sonar.projectName=Ontrackchain Monorepo (Regtech AML/CFT)
sonar.projectVersion=3.1.0-m5

# --- Fontes + exclui óbvios (node_modules, dist, __pycache__, migrations, .github) ---
sonar.sources=ontrackchain/apps,ontrackchain/packages
sonar.tests=ontrackchain/apps,ontrackchain/packages
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/__pycache__/**,\
  **/*.egg-info/**,\
  **/.venv/**,\
  **/.hatch/**,\
  **/packages/qa-gateway/src/ontrackchain_qa_gateway/migrations/**,\
  **/apps/frontend/.next/**,\
  **/apps/frontend/out/**,\
  **/apps/frontend/public/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  **/tmp_*/**

# --- Linguagens ---
sonar.language=py
sonar.python.version=3.11

# --- Reports (S28+47: 100% IDÊNTICOS aos args CI.yml sonarcloud-codecov-quality-gate L739-L742) ---
# Coverage: 2 fontes = (a) pasta agregada tmp_coverage (b) coverage individual por app
sonar.python.coverage.reportPaths=\
  ontrackchain/tmp_coverage/*.xml,\
  ontrackchain/apps/*/tmp_coverage/coverage.xml,\
  ontrackchain/packages/*/tmp_coverage/coverage.xml
# JUnit / xUnit reports
sonar.python.xunit.reportPath=\
  ontrackchain/tmp_tests/reports/*.xml,\
  ontrackchain/apps/*/tmp_tests/reports/*.xml,\
  ontrackchain/packages/*/tmp_tests/reports/*.xml
# Bandit SAST report (tmp_sast/bandit.json gerado por job sast-bandit-python)
sonar.python.bandit.reportPaths=\
  ontrackchain/tmp_sast/bandit.json
# Ruff lint SARIF report (tmp_lint/ gerado por job lint + sonarcloud-standalone)
sonar.python.ruff.reportPaths=\
  ontrackchain/tmp_lint/ruff-report.sarif.json

# --- Duplicação ---
sonar.cpd.exclusions=**/tests/**,**/migrations/**
sonar.cpd.python.minimumtokens=150

# --- Code smells / Segurança ---
sonar.security.hotspots.reviewPriorityThreshold=MEDIUM
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S101
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*test*

# --- Teste paths (evita falso-negativo 0% testes se reports não vierem) ---
sonar.test.inclusions=\
  ontrackchain/apps/*/tests/**,\
  ontrackchain/packages/*/tests/**,\
  ontrackchain/apps/frontend/tests/e2e/**

# --- Quality Gate (overall 80% / patch 85% — idêntico ao CI.yml wait=true) ---
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# --- Charset e encoding ---
sonar.sourceEncoding=UTF-8
sonar.working.directory=.scannerwork
