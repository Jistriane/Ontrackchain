# ============================================================
# SonarCloud Project Properties — Ontrackchain Monorepo
# Sprint S28+26 P2: integração básica com job ci.yml L660 SonarCloud Gate
# Provedor: SonarCloud (sonarcloud.io). Organização: ontrackchain (exemplo)
# Ativar em: GitHub Secrets → SONAR_TOKEN (gerar em sonarcloud.io account)
# ============================================================

# --- Identidade do projeto (substitua pelos valores REAIS do SonarCloud) ---
sonar.organization=ontrackchain
sonar.projectKey=ontrackchain_ontrackchain
sonar.projectName=Ontrackchain Monorepo (Regtech AML/CFT)
sonar.projectVersion=3.1.0-m5

# --- Fontes + exclui óbvios (node_modules, dist, __pycache__, migrations, .github) ---
sonar.sources=ontrackchain/apps,ontrackchain/packages
sonar.tests=ontrackchain/apps,ontrackchain/packages
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/__pycache__/**,\
  **/*.egg-info/**,\
  **/.venv/**,\
  **/.hatch/**,\
  **/packages/qa-gateway/src/ontrackchain_qa_gateway/migrations/**,\
  **/apps/frontend/.next/**,\
  **/apps/frontend/out/**,\
  **/apps/frontend/public/**,\
  **/test-results/**,\
  **/playwright-report/**

# --- Linguagens ---
sonar.language=py
sonar.python.version=3.11
sonar.python.coverage.reportPaths=ontrackchain/coverage.xml,ontrackchain/htmlcov/*coverage.xml
sonar.python.xunit.reportPath=ontrackchain/junit-report.xml
sonar.python.bandit.reportPaths=ontrackchain/bandit-report.json
sonar.python.ruff.reportPaths=ontrackchain/ruff-report.sarif.json

# --- Duplicação ---
sonar.cpd.exclusions=**/tests/**,**/migrations/**
sonar.cpd.python.minimumtokens=150

# --- Code smells / Segurança ---
sonar.security.hotspots.reviewPriorityThreshold=MEDIUM
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S101
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*test*

# --- Teste paths (evita falso-negativo 0% testes se reports não vierem) ---
sonar.test.inclusions=\
  ontrackchain/apps/*/tests/**,\
  ontrackchain/packages/*/tests/**,\
  ontrackchain/apps/frontend/tests/e2e/**

# --- Charset e encoding ---
sonar.sourceEncoding=UTF-8
sonar.working.directory=.scannerwork
